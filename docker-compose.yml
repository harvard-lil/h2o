services:
  db:
    image: postgres:16.6
    volumes:
      - db_data_16:/var/lib/postgresql/data:delegated
    ports:
      - "127.0.0.1:54320:5432"
    environment:
      - POSTGRES_PASSWORD=example

  web:
    # Built locally, not pulled. pull_policy: build means a plain
    # `docker compose up` rebuilds when a build input changes and is a ~0.6s
    # no-op when nothing has -- so there is no flag to remember and no way to
    # end up running a stale image after pulling someone else's dependency
    # change. docker's layer cache is the staleness check.
    build:
      context: .
      dockerfile: ./Dockerfile
      target: dev
    pull_policy: build
    tty: true
    command: bash
    environment:
    - DOCKERIZED=true
    - PDF_EXPORT_BUCKET=h2o.pdf_exports

    volumes:
      - .:/app:delegated
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8080:8080"
    extra_hosts:
      - "opencasebook.test:127.0.0.1"
    networks:
      default:
        aliases:
          - 'opencasebook.test'
    depends_on:
      - db
    # allow profiling with py-spy
    # https://github.com/benfred/py-spy#how-do-i-run-py-spy-in-docker
    cap_add:
        - SYS_PTRACE

  # S3-compatible storage: Versity S3 Gateway with its posix backend. Each bucket
  # is a top-level directory in the s3_data volume, and each object is a file at
  # its key's path. The opencasebook.minio.test hostname predates the switch from
  # MinIO and is kept so existing hosts-file entries still work.
  s3:
    image: versity/versitygw:v1.8.0@sha256:30292fc2eeacc67a36993b01f7a7a5e3361a19cced0e80c1d71cfa2a4b0a2499
    entrypoint:
      - "/entrypoint.sh"
    environment:
      - ROOT_ACCESS_KEY=accesskey
      - ROOT_SECRET_KEY=secretkey
      - VGW_PORT=:9000
      - VGW_BACKEND=posix
      - VGW_BACKEND_ARG=/data
      - BUCKET=h2o.images
      - EXPORT_BUCKET=h2o.exports
      - PDF_EXPORT_BUCKET=h2o.pdf_exports
    volumes:
      - ./docker/s3/entrypoint.sh:/entrypoint.sh
      - s3_data:/data
    ports:
      - "127.0.0.1:9000:9000"
    extra_hosts:
      - "opencasebook.minio.test:127.0.0.1"
    networks:
      default:
        aliases:
          - 'opencasebook.minio.test'

  pandoc-lambda:
    build:
      context: ./docker/pandoc-lambda
    pull_policy: build
    tty: true
    environment:
      - USE_S3_CREDENTIALS=True
      - AWS_ACCESS_KEY_ID=accesskey
      - AWS_SECRET_ACCESS_KEY=secretkey
      - S3_ENDPOINT_URL=http://s3:9000
      - EXPORT_BUCKET=h2o.exports
    # volumes: is set for local dev in docker-compose.override.yml
    # Uncomment to disable entrypoint if changes to requirements mean container can't start:
    # command: bash

volumes:
  db_data_16:
  s3_data:

networks:
  default:
