# Overrides for local development, not used in CI.
#
# The build configuration lives in docker-compose.yml so that CI and developers
# build the same way. What is left here is genuinely dev-only.
services:
  pandoc-lambda:
    volumes:
      - ./docker/pandoc-lambda/function/:/function
  web:
    environment:
      - CAPAPI_API_KEY
      - GPO_API_KEY
      - COURTLISTENER_API_KEY
      - MATOMO_API_KEY
      - MATOMO_SITE_URL
