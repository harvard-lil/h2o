# CI override: run the test suite against the artifact that actually ships.
#
# docker-compose.yml plus docker-compose.override.yml give a developer the `dev`
# image with the working tree bind-mounted at /app. That is right for local
# iteration, but it means CI would be testing the source tree rather than the
# built image -- the bind mount shadows whatever the image contains.
#
# This file instead builds the `test` target, which is FROM prod: prod's uwsgi
# layer, prod's non-root `h2o` user, prod's baked-in code, plus the test
# toolchain. The bind mount is removed so nothing shadows it.
#
# Used only by .github/workflows/lint_test.yml:
#   docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d
# Note that docker-compose.override.yml is deliberately NOT included; compose
# only applies it automatically when no -f flags are given.
services:
  web:
    build:
      context: .
      dockerfile: ./Dockerfile
      target: test
    image: h2o-test:ci
    # The image inherits H2O_SETTINGS_MODULE=settings_aws_ecs from the prod stage,
    # and those settings require APP_CONFIG -- a production secret CI has no business
    # holding. Override it here rather than weakening the image: the artifact stays
    # byte-identical to what ships, and only the runtime config differs. That
    # separation is the entire point of selecting settings from the environment.
    environment:
      - H2O_SETTINGS_MODULE=settings_dev
    # Drop the bind mount inherited from docker-compose.yml. Without this the
    # working tree would be mounted over /app and we would be back to testing
    # source instead of the image.
    volumes: !reset []

  # Build this rather than pulling it. docker-compose.yml names a published
  # image and only docker-compose.override.yml carries a build section, which
  # CI does not load -- so without this, CI can only pull, and a tag that does
  # not exist yet (a new registry, a bumped version) fails the whole run before
  # a single test executes. Building also means CI exercises the pandoc-lambda
  # source in the branch under test, rather than whatever was last published.
  pandoc-lambda:
    build:
      context: ./docker/pandoc-lambda
