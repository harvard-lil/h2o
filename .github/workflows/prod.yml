name: Production - Deploy to AWS

on:
  push:
    branches: [prod]
  pull_request:
    branches: [prod]

permissions:
    id-token: write   # assume the deploy role via OIDC
    contents: read

jobs:
  # Only allow merges from staging
  check-source-branch:
    name: Check Source Branch
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Verify source branch is staging
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "staging" ]; then
            echo "❌ Error: Pull requests to prod must come from staging branch"
            exit 1
          fi
          echo "✅ Source branch verification passed"

  lint-and-test:
    uses: ./.github/workflows/lint_test.yml
    secrets: inherit
    needs: check-source-branch
    if: always() && (github.event_name == 'push' || needs.check-source-branch.result == 'success')

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: always() && github.event_name == 'push' && needs.lint-and-test.result == 'success'
    
    env:
      LOAD_BALANCER: ${{ secrets.PROD_LOAD_BALANCER }}
      TARGET_GROUP: ${{ secrets.PROD_TARGET_GROUP }}
      MAINTENANCE_TARGET_GROUP: ${{ secrets.PROD_MAINTENANCE_TARGET_GROUP }}
      ECR_REPOSITORY: ${{ secrets.PROD_ECR_REPOSITORY }}
      IMAGE_TAG: latest
      TASK_DEFINITION_FAMILY: ${{ secrets.PROD_TASK_DEFINITION_FAMILY }}
      CONTAINER_NAME: ${{ secrets.PROD_CONTAINER_NAME }}
      ECS_CLUSTER: ${{ secrets.PROD_ECS_CLUSTER }}
      ECS_SERVICE: ${{ secrets.PROD_ECS_SERVICE }}
      EVENT_RULES: ${{ secrets.PROD_EVENT_RULES }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.PROD_AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.PROD_AWS_REGION }}


      - name: Login to AWS ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      # Production never builds. It ships the exact image staging is running.
      #
      # We read that image out of staging's ECS task definition rather than
      # resolving a git SHA, because the SHA chain does not survive two merges:
      # on staging, HEAD^2 is the main tip the image was tagged with, but on prod
      # HEAD^2 is the staging *merge commit*, which no image carries. Reading the
      # running definition is also independent of whether merges were merge
      # commits, squashes, or rebases -- staging pins a digest there, so that
      # definition IS the record of what was validated.
      - name: Resolve the image staging validated
        id: resolve
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          STAGING_ECS_CLUSTER: ${{ secrets.STAGING_ECS_CLUSTER }}
          STAGING_ECS_SERVICE: ${{ secrets.STAGING_ECS_SERVICE }}
          STAGING_CONTAINER_NAME: ${{ secrets.STAGING_CONTAINER_NAME }}
          STAGING_ECR_REPOSITORY: ${{ secrets.STAGING_ECR_REPOSITORY }}
        run: |
          set -euo pipefail

          # Ask the staging SERVICE which revision it is running, then read that
          # exact revision. Querying the family instead returns its latest ACTIVE
          # revision, which is not necessarily the deployed one -- a failed
          # deploy, a Terraform apply, or a half-finished rollout all register
          # revisions the service never adopted.
          STAGING_TASK_DEF=$(aws ecs describe-services \
            --cluster "$STAGING_ECS_CLUSTER" \
            --services "$STAGING_ECS_SERVICE" \
            --query "services[0].taskDefinition" \
            --output text)

          if [ -z "$STAGING_TASK_DEF" ] || [ "$STAGING_TASK_DEF" = "None" ]; then
            echo "::error::Could not read the running task definition for service"
            echo "::error::'$STAGING_ECS_SERVICE' in cluster '$STAGING_ECS_CLUSTER'."
            exit 1
          fi
          echo "Staging is running $STAGING_TASK_DEF"

          STAGING_IMAGE=$(aws ecs describe-task-definition \
            --task-definition "$STAGING_TASK_DEF" \
            --query "taskDefinition.containerDefinitions[?name=='${STAGING_CONTAINER_NAME}'].image | [0]" \
            --output text)

          if [ -z "$STAGING_IMAGE" ] || [ "$STAGING_IMAGE" = "None" ]; then
            echo "::error::Could not read an image for container '$STAGING_CONTAINER_NAME'"
            echo "::error::from task definition '$STAGING_TASK_DEF'."
            exit 1
          fi

          # Require a digest. Staging pins one; a floating tag here means staging
          # was deployed by something older and we cannot prove what it is running.
          case "$STAGING_IMAGE" in
            *@sha256:*) ;;
            *)
              echo "::error::Staging is running '$STAGING_IMAGE', which is not digest-pinned."
              echo "::error::Refusing to promote an artifact we cannot identify."
              echo "::error::Re-run the staging deploy first."
              exit 1
              ;;
          esac

          DIGEST="${STAGING_IMAGE#*@}"

          # Recover which commit built this artifact, by reading the other tags
          # on the same digest. The web image and its matching pandoc-lambda
          # image are both tagged with the commit SHA, so this is what lets the
          # export Lambda be promoted from the same commit as the web service
          # rather than from whatever main happens to point at now.
          SOURCE_SHA=$(aws ecr describe-images \
            --repository-name "$STAGING_ECR_REPOSITORY" \
            --image-ids "imageDigest=$DIGEST" \
            --query 'imageDetails[0].imageTags' --output text \
            | tr '\t' '\n' | { grep -E '^[0-9a-f]{40}$' || true; } | head -n1)

          if [ -z "$SOURCE_SHA" ]; then
            echo "::error::No commit-SHA tag on $DIGEST in $STAGING_ECR_REPOSITORY,"
            echo "::error::so the matching pandoc-lambda image cannot be identified."
            exit 1
          fi

          echo "Promoting $STAGING_IMAGE, built from $SOURCE_SHA"
          echo "staging-image=$STAGING_IMAGE" >> "$GITHUB_OUTPUT"
          echo "source-sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "image-digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "image-uri=${REGISTRY}/${ECR_REPOSITORY}@${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Copy that image into the production repository
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          STAGING_IMAGE: ${{ steps.resolve.outputs.staging-image }}
        run: |
          set -euxo pipefail
          # Manifest-only copy between repositories in the same registry: no
          # layers move and the digest is preserved, so production runs the same
          # bytes staging did.
          docker buildx imagetools create \
            --tag "${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}" \
            "$STAGING_IMAGE"

      # Retention keeps `deployed-` images long past the build candidates that
      # churn by every merge to main. The production task definition is pinned to
      # this digest, so it has to outlive them.
      - name: Mark the promoted web image as deployed
        uses: harvard-lil/lil-actions/ecr-tag-image@main
        with:
          repository: ${{ env.ECR_REPOSITORY }}
          source: ${{ steps.resolve.outputs.image-digest }}
          tag: deployed-${{ steps.resolve.outputs.source-sha }}

      - name: Pin the web container to the promoted digest
        id: task-def
        uses: harvard-lil/lil-actions/ecs-register-task-def@main
        with:
          task-definition-family: ${{ env.TASK_DEFINITION_FAMILY }}
          container-name: ${{ env.CONTAINER_NAME }}
          image-uri: ${{ steps.resolve.outputs.image-uri }}

      - name: Deploy the digest-pinned task definition
        uses: harvard-lil/lil-actions/ecs-deploy@main
        with:
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          task-definition: ${{ steps.task-def.outputs.task-definition-arn }}

      # Production's export Lambda had no deploy path at all before this, which
      # is how it came to sit on an image built in August 2024.
      - name: Point the production export Lambda at the promoted image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          SOURCE_SHA: ${{ steps.resolve.outputs.source-sha }}
        run: |
          set -euxo pipefail
          aws lambda update-function-code \
            --function-name h2o-export \
            --image-uri "${REGISTRY}/pandoc-lambda:${SOURCE_SHA}" >/dev/null

      - name: Put site into maintenance mode
        uses: harvard-lil/lil-actions/ecs-maintenance@main
        with:
          mode: 'on'
          load-balancer: ${{ env.LOAD_BALANCER }}
          target-group: ${{ env.TARGET_GROUP }}
          maintenance-target-group: ${{ env.MAINTENANCE_TARGET_GROUP }}

      - name: Wait for the new deployment to become stable
        uses: harvard-lil/lil-actions/ecs-wait-for-deployment@main
        with:
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}

      - name: Run Django migrations
        id: migrate
        uses: harvard-lil/lil-actions/ecs-django-migrations@main
        with:
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          container: ${{ env.CONTAINER_NAME }}
          migrate-command: 'python manage.py migrate'

      - name: Create search index
        uses: harvard-lil/lil-actions/ecs-exec-command@main
        with:
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          container: ${{ env.CONTAINER_NAME }}
          command: 'invoke create-search-index'

      - name: Create reporting views
        uses: harvard-lil/lil-actions/ecs-exec-command@main
        with:
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          container: ${{ env.CONTAINER_NAME }}
          command: 'invoke create-reporting-views'

      - name: Update scheduled tasks with new task definition
        uses: harvard-lil/lil-actions/ecs-update-eventbridge@main
        with:
          event-rules: ${{ env.EVENT_RULES }}
          task-definition-arn: ${{ steps.task-def.outputs.task-definition-arn }}

      # Maintenance goes on before the rollout is confirmed, and until now no
      # step in this job had an `if:`. So any failure in between -- a bad image,
      # a slow rollout, a broken index rebuild -- aborted the workflow with the
      # maintenance page still up, and it stayed up until someone flipped the
      # load balancer by hand. ECS runs at minimumHealthyPercent 100, so the old
      # tasks are still serving throughout: the site was only ever down because
      # the maintenance page was covering a working site.
      #
      # Migrations are the one exception. A migration that fails partway can
      # leave the schema in a state neither the old nor the new code is safe
      # against, so that case deliberately stays dark for a human. `cancelled`
      # is treated the same way, since interrupting a migration is no safer than
      # having one fail.
      - name: Turn off Maintenance mode
        if: always() && (steps.migrate.outcome == 'success' || steps.migrate.outcome == 'skipped')
        uses: harvard-lil/lil-actions/ecs-maintenance@main
        with:
          mode: 'off'
          load-balancer: ${{ env.LOAD_BALANCER }}
          target-group: ${{ env.TARGET_GROUP }}
          maintenance-target-group: ${{ env.MAINTENANCE_TARGET_GROUP }}

      # The condition here is the exact complement of the step above, so the
      # site is never left behind the maintenance page without this firing.
      - name: Report that the site was left in maintenance
        if: always() && steps.migrate.outcome != 'success' && steps.migrate.outcome != 'skipped'
        run: |
          echo "::error::Django migrations did not complete (outcome: ${{ steps.migrate.outcome }})."
          echo "::error::MAINTENANCE MODE IS STILL ON and was left on deliberately --"
          echo "::error::https://opencasebook.org is serving the maintenance page, not the application."
          echo "::error::The database may be partially migrated. Check its state before"
          echo "::error::lifting maintenance; re-running this workflow will not lift it"
          echo "::error::either, because it will fail at the same step."
          exit 1

      - name: Purge Cloudflare cache
        uses: harvard-lil/lil-actions/cloudflare-purge@main
        with:
          zone: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          token: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      
      # Without this a failed deploy sends nothing at all, since the success
      # notification below does not run. The case that matters is the one where
      # the site is deliberately dark and nobody has been told.
      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2.1.1
        with:
            webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
            webhook-type: incoming-webhook
            payload: |
              {
                "blocks": [
                    {
                      "type": "section",
                      "text": {
                          "type": "mrkdwn",
                          "text": "*Prod H2O deploy FAILED*"
                      }
                    },
                    {
                      "type": "section",
                      "text": {
                          "type": "mrkdwn",
                          "text": "*Maintenance mode:*\n${{ (steps.migrate.outcome != 'success' && steps.migrate.outcome != 'skipped') && 'STILL ON - the site is serving the maintenance page' || 'lifted - the site is serving the previous version' }}\n*Run:*\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.run_id }}>"
                      }
                    }
                ]
              }

      - name: Notify Slack
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2.1.1
        with:
            webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
            webhook-type: incoming-webhook
            payload: |
              {
                "blocks": [
                    {
                      "type": "section",
                      "text": {
                          "type": "mrkdwn",
                          "text": "*Prod H2O deployed successfully!*"
                      }
                    },
                    {
                    "type": "section",
                      "text": {
                          "type": "mrkdwn",
                          "text": "*Repo:*\n<https://github.com/${{ github.repository }}|`${{ github.repository }}`>\n*Branch:*\n<https://github.com/${{ github.repository }}/tree/${{ github.ref_name }}|`${{ github.ref_name }}`>\n*Commit:*\n<https://github.com/${{ github.repository }}/commit/${{ github.sha }}|`${{ github.sha }}`>"
                      } 
                    },
                    {
                    "type": "section",
                      "text": {
                          "type": "mrkdwn",
                          "text": "*View the site:* <https://opencasebook.org|https://opencasebook.org>"
                      }
                    }
                ]
              }