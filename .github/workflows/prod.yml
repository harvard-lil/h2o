name: Production - Deploy to AWS

on:
  push:
    branches: [prod]
  pull_request:
    branches: [prod]

permissions:
    id-token: write     # assume the deploy role via OIDC
    contents: read
    pull-requests: read # read deploy labels off the merged pull request

jobs:
  # Only allow merges from staging
  check-source-branch:
    name: Check Source Branch
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Verify source branch is staging
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "staging" ]; then
            echo "❌ Error: Pull requests to prod must come from staging branch"
            exit 1
          fi
          echo "✅ Source branch verification passed"

  # Neither deploy tier lints or tests. check-source-branch limits this branch to
  # merges from staging, and the resolve step below promotes the image the
  # staging service is running rather than building anything.
  prepare:
    name: Prepare the production artifact
    runs-on: ubuntu-latest
    environment: prod
    if: github.event_name == 'push'
    
    outputs:
      image-digest: ${{ steps.resolve.outputs.staging-digest }}
      source-sha: ${{ steps.resolve.outputs.source-sha }}

    env:
      # One repository holds every h2o image both tiers run. Named here rather
      # than read from the environment because it is the same name in every
      # tier, the way `pandoc-lambda` in the other workflows already is.
      ECR_REPOSITORY: h2o
      IMAGE_TAG: prod-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}


      - name: Login to AWS ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      # Production never builds. It ships the exact image staging is running.
      #
      # We read that image out of staging's ECS task definition rather than
      # resolving a git SHA, because the SHA chain does not survive two merges:
      # on staging, HEAD^2 is the main tip the image was tagged with, but on prod
      # HEAD^2 is the staging *merge commit*, which no image carries. Reading the
      # running definition is also independent of whether merges were merge
      # commits, squashes, or rebases -- staging pins a digest there, so that
      # definition IS the record of what was validated.
      - name: Resolve the image staging validated
        id: resolve
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          STAGING_ECS_CLUSTER: ${{ vars.SOURCE_ECS_CLUSTER }}
          STAGING_ECS_SERVICE: ${{ vars.SOURCE_ECS_SERVICE }}
          STAGING_CONTAINER_NAME: ${{ vars.SOURCE_CONTAINER_NAME }}
        run: |
          set -euo pipefail

          # Ask the staging SERVICE which revision it is running, then read that
          # exact revision. Querying the family instead returns its latest ACTIVE
          # revision, which is not necessarily the deployed one -- a failed
          # deploy, a Terraform apply, or a half-finished rollout all register
          # revisions the service never adopted.
          STAGING_TASK_DEF=$(aws ecs describe-services \
            --cluster "$STAGING_ECS_CLUSTER" \
            --services "$STAGING_ECS_SERVICE" \
            --query "services[0].taskDefinition" \
            --output text)

          if [ -z "$STAGING_TASK_DEF" ] || [ "$STAGING_TASK_DEF" = "None" ]; then
            echo "::error::Could not read the running task definition for service"
            echo "::error::'$STAGING_ECS_SERVICE' in cluster '$STAGING_ECS_CLUSTER'."
            exit 1
          fi
          echo "Staging is running $STAGING_TASK_DEF"

          STAGING_IMAGE=$(aws ecs describe-task-definition \
            --task-definition "$STAGING_TASK_DEF" \
            --query "taskDefinition.containerDefinitions[?name=='${STAGING_CONTAINER_NAME}'].image | [0]" \
            --output text)

          if [ -z "$STAGING_IMAGE" ] || [ "$STAGING_IMAGE" = "None" ]; then
            echo "::error::Could not read an image for container '$STAGING_CONTAINER_NAME'"
            echo "::error::from task definition '$STAGING_TASK_DEF'."
            exit 1
          fi

          # Require a digest. Staging pins one; a floating tag here means staging
          # was deployed by something older and we cannot prove what it is running.
          case "$STAGING_IMAGE" in
            *@sha256:*) ;;
            *)
              echo "::error::Staging is running '$STAGING_IMAGE', which is not digest-pinned."
              echo "::error::Refusing to promote an artifact we cannot identify."
              echo "::error::Re-run the staging deploy first."
              exit 1
              ;;
          esac

          DIGEST="${STAGING_IMAGE#*@}"

          # Both tiers run out of one repository, and promotion is a tag added
          # to the image already in it, so staging has to be running an image
          # from that repository for there to be anything to tag. Staging
          # deployed before the two repositories were consolidated is running
          # an image from the archive, which this cannot promote.
          case "$STAGING_IMAGE" in
            */"${ECR_REPOSITORY}"@*) ;;
            *)
              echo "::error::Staging is running '$STAGING_IMAGE', which is not"
              echo "::error::in the ${ECR_REPOSITORY} repository. Re-run the staging deploy,"
              echo "::error::so that it promotes an image production can tag."
              exit 1
              ;;
          esac

          # Recover which commit built this artifact, by reading the other tags
          # on the same digest. The web image and its matching pandoc-lambda
          # image are both tagged with the commit SHA, so this is what lets the
          # export Lambda be promoted from the same commit as the web service
          # rather than from whatever main happens to point at now.
          SOURCE_SHA=$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageDigest=$DIGEST" \
            --query 'imageDetails[0].imageTags' --output text \
            | tr '\t' '\n' | { grep -E '^[0-9a-f]{40}$' || true; } | head -n1)

          if [ -z "$SOURCE_SHA" ]; then
            echo "::error::No commit-SHA tag on $DIGEST in $ECR_REPOSITORY,"
            echo "::error::so the matching pandoc-lambda image cannot be identified."
            exit 1
          fi

          echo "Promoting $STAGING_IMAGE, built from $SOURCE_SHA"
          echo "staging-image=$STAGING_IMAGE" >> "$GITHUB_OUTPUT"
          echo "source-sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "staging-digest=$DIGEST" >> "$GITHUB_OUTPUT"

      # Promotion is a tag, not a copy. The image staging tested is already in
      # this repository, so production adds `prod-deployed-<sha>` to that exact
      # digest and deploys it -- there is no second repository to move it to and
      # so no second digest to reconcile with the first.
      #
      # `ecr-tag-image` re-registers the same manifest bytes under an additional
      # tag, which leaves the digest alone. The retention rule on
      # `prod-deployed-` is what keeps this image alive past the build
      # candidates that churn by every merge to main; the production task
      # definition is pinned to it, so it has to outlive them.
      - name: Mark the promoted web image as deployed
        uses: harvard-lil/lil-actions/ecr-tag-image@main
        with:
          repository: ${{ env.ECR_REPOSITORY }}
          source: ${{ steps.resolve.outputs.staging-digest }}
          tag: prod-deployed-${{ steps.resolve.outputs.source-sha }}

      # Keep the moving :prod-latest tag pointing at what we deploy, so a Terraform
      # apply (whose task definition references it) cannot quietly revert the
      # service to an older image. The two tiers share a repository but not
      # this tag: one tag written by both would point at whichever tier
      # deployed last, which would let production fall back to an image it never
      # promoted. Every deploy replaces it with a digest, and nothing reads it
      # to decide what to ship.
      - name: Point :prod-latest at the promoted image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          STAGING_IMAGE: ${{ steps.resolve.outputs.staging-image }}
        run: |
          set -euxo pipefail
          docker buildx imagetools create \
            --tag "${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}" \
            "$STAGING_IMAGE"

  # The shared sequence. Everything above identifies which artifact to deploy
  # and marks it for this tier; everything below is identical for both tiers and
  # lives in one file so a staging run exercises production's code.
  deploy:
    needs: prepare
    # Named rather than left to the default success(): a job with no condition of
    # its own is skipped when anything in its needs graph is skipped, regardless
    # of whether the jobs it depends on succeeded.
    if: always() && needs.prepare.result == 'success'
    uses: ./.github/workflows/deploy_sequence.yml
    with:
      environment: prod
      environment-label: Prod
      image-digest: ${{ needs.prepare.outputs.image-digest }}
      source-sha: ${{ needs.prepare.outputs.source-sha }}
    secrets:
      cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}

  # A job whose condition does not hold is skipped, and a skipped job leaves the
  # run green. This job is what makes a deploy that did not happen show up as a
  # failed run rather than a successful build.
  confirm-deploy:
    name: Confirm the deploy ran
    needs: [prepare, deploy]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Require a completed deploy
        env:
          RESULT: ${{ needs.deploy.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "::error::prepare succeeded but deploy was '$RESULT'; nothing was deployed."
            exit 1
          fi
          echo "deploy completed"
