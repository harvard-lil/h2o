name: Lint and Test

on:
  workflow_call:
    secrets:
      # Declared so a caller can pass exactly what a given event needs. A
      # pull_request run gets only CODECOV_TOKEN; publishing secrets are
      # required=false and simply absent there, which is what keeps the
      # publish steps unable to run even if their `if:` guards were wrong.
      CODECOV_TOKEN:
        required: false
      BUILD_AWS_ROLE_TO_ASSUME:
        required: false
      STAGING_AWS_REGION:
        required: false

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      
      - name: Run flake8
        run: |
          pip install "$(grep -Eo 'flake8==\S+' web/requirements.txt)"
          flake8 web/ --config web/setup.cfg
          flake8 docker/pandoc-lambda/function/ --config web/setup.cfg
      
      - name: Run black
        run: |
          pip install "$(grep -Eo 'black==\S+' web/requirements.txt)"
          black --check --diff .
      
      - name: Run mypy
        run: |
          cd web
          # CPUCOUNT=1 for the same reason the Dockerfile sets it: uwsgi's build
          # spawns one compiler thread per CPU, and on a multi-core runner they
          # intermittently collide with `OSError: [Errno 14] Bad address:
          # '/bin/sh'`. Nothing here needs uwsgi -- it arrives through
          # requirements.txt -- so the cost of serialising its build is a few
          # seconds against an occasional red build on an unrelated commit.
          CPUCOUNT=1 pip install -r requirements.txt
          PYTHONPATH=. mypy

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    env:
      # The one repository h2o's images are published to and both tiers deploy
      # from. Named here rather than read from the environment because it is the
      # same name in every tier, the way `pandoc-lambda` below already is.
      ECR_REPOSITORY: h2o
      # Compose reads this itself, so every `docker compose` call below picks up
      # both files with no flags. Setting it also stops compose auto-loading
      # docker-compose.override.yml, which is developer-only.
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
    # don't run on pushes to forks
    if: github.event_name == 'pull_request' || github.repository == 'harvard-lil/h2o'
    
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # On a main-workflow retry, ask the registry whether this commit already
      # completed publication before spending several minutes rebuilding it.
      # Pull requests have no publishing credentials and always run the suite.
      - name: Configure build credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.BUILD_AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.STAGING_AWS_REGION }}

      - name: Login to AWS ECR
        id: publish-ecr-login
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Inspect the web image publication
        id: web-publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: harvard-lil/lil-actions/ecr-publication-state@main
        with:
          repository: ${{ env.ECR_REPOSITORY }}
          tag: ${{ github.sha }}
          registry: ${{ steps.publish-ecr-login.outputs.registry }}
          required-artifact-types: >-
            ["application/vnd.harvard-lil.h2o.migrations.v1+json",
             "application/vnd.harvard-lil.h2o.staticassets.v1.tar+gzip"]

      - name: Inspect the pandoc Lambda publication
        id: lambda-publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: harvard-lil/lil-actions/ecr-publication-state@main
        with:
          repository: pandoc-lambda
          tag: ${{ github.sha }}
          registry: ${{ steps.publish-ecr-login.outputs.registry }}

      # An image without all of its declared referrers records a failed run
      # after the immutable image push. Rebuilding cannot safely repair it: the
      # rebuilt bytes may differ from the image already carrying this SHA.
      - name: Refuse a partial web publication
        if: steps.web-publication.outputs.state == 'partial'
        env:
          DIGEST: ${{ steps.web-publication.outputs.digest }}
          MISSING: ${{ steps.web-publication.outputs.missing-artifact-types }}
        run: |
          echo "::error::${ECR_REPOSITORY}:${GITHUB_SHA} is a partial publication at ${DIGEST}."
          echo "::error::Missing referrer types: ${MISSING}"
          echo "::error::Repair those referrers from the existing digest; do not rebuild the SHA."
          exit 1

      # Deliberately uncached. A remote layer cache was measured here and did
      # not pay for itself: this image's expensive steps -- npm ci, pip install,
      # npm run build -- come to roughly 170s of compute, and their outputs are
      # large enough that fetching and storing them costs about as much as doing
      # the work. A warm run saved on the order of ten seconds against building
      # from scratch, in exchange for a container-driver builder, exported cache
      # credentials, an API-version flag, and 4 GB of the repository's 10 GB
      # cache budget squatting on every other branch's entries.
      #
      # Build the deployable image and the image the suite runs against in one
      # go. `test` is FROM `prod`, so this produces prod's layers once and tests
      # against exactly them -- the two cannot drift the way they did when the
      # prod image was rebuilt separately after the tests had already passed.
      #
      # Nothing is pushed here. The prod image is held locally and published
      # further down, only if the suite is green.
      - name: Build the prod and test images
        if: github.event_name == 'pull_request' || steps.web-publication.outputs.state == 'absent'
        run: |
          set -euxo pipefail
          docker buildx build \
            --target prod \
            --load \
            -t h2o-prod:${{ github.sha }} \
            -f ./Dockerfile .

          # `test` reuses the prod layers just built, so this is nearly free.
          docker buildx build \
            --target test \
            --load \
            -t h2o-test:ci \
            -f ./Dockerfile .

      # The collected static files and the migration list are built into the
      # image (see the Dockerfile), so they are read out of it with `docker
      # create`, which gives a container filesystem without starting anything.
      # They describe the image that ships rather than whatever a running
      # service happened to have on disk. Both are needed as files on the runner
      # for the attachment seam further down.
      - name: Extract the image's static files and migration list
        if: github.event_name == 'pull_request' || steps.web-publication.outputs.state == 'absent'
        run: |
          set -euxo pipefail
          rm -rf image-artifacts
          mkdir -p image-artifacts
          container="$(docker create "h2o-prod:${{ github.sha }}")"
          docker cp "${container}:/app/web/static" image-artifacts/static
          docker cp "${container}:/app/web/migrations.json" image-artifacts/migrations.json
          docker rm "${container}"

          # These four come from installed packages, not from the checkout, so
          # they are here only if collectstatic ran during the build.
          for collected in admin rest_framework django_extensions css; do
            test -d "image-artifacts/static/${collected}"
          done
          jq -e '.migrations | length > 0' image-artifacts/migrations.json
          jq -r '"migrations.json: \(.count) migrations, hash \(.hash)"' image-artifacts/migrations.json

      - name: docker compose up
        if: github.event_name == 'pull_request' || steps.web-publication.outputs.state == 'absent'
        run: |
          docker compose pull --ignore-pull-failures || true
          docker compose up -d
          docker ps -a
          docker compose logs

      - name: Python tests
        if: github.event_name == 'pull_request' || steps.web-publication.outputs.state == 'absent'
        shell: 'script -q -e -c "bash --noprofile --norc -eo pipefail {0}"'  # avoid docker-compose "the input device is not a TTY" -- see https://github.com/actions/runner/issues/241#issuecomment-842566950
        run: |
          set -x
          docker compose exec web pytest \
            --cov --cov-config=setup.cfg --cov-report xml  `# write coverage data to .coverage for upload by codecov` \
            -vv -n auto --dist loadgroup

      - name: Javascript tests
        if: github.event_name == 'pull_request' || steps.web-publication.outputs.state == 'absent'
        shell: 'script -q -e -c "bash --noprofile --norc -eo pipefail {0}"'  # avoid docker-compose "the input device is not a TTY" -- see https://github.com/actions/runner/issues/241#issuecomment-842566950
        run: |
          set -x
          # No npm install or npm run build: node_modules and the compiled
          # bundles both come from the assets stage, inside the image.
          docker compose exec web npm run lint
          docker compose exec web npm run test

      # pytest writes coverage.xml inside the container. CI mounts nothing, so
      # without this codecov finds no report -- it fails soft, so this was
      # passing silently rather than erroring.
      - name: Extract coverage report
        if: github.event_name == 'pull_request' || steps.web-publication.outputs.state == 'absent'
        run: |
          set -euxo pipefail
          docker compose cp web:/app/web/coverage.xml web/coverage.xml
          test -s web/coverage.xml

      ### codecov ###
      # https://github.com/codecov/codecov-action
      - name: Codecov
        if: github.event_name == 'pull_request' || steps.web-publication.outputs.state == 'absent'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      # Push the image built at the top of this job -- not a rebuild. Tagged with
      # the commit main actually points at, so staging can find it.
      - name: Publish the prod image to ECR
        id: publish-web
        if: steps.web-publication.outputs.state == 'absent'
        uses: harvard-lil/lil-actions/ecr-publish-image@main
        with:
          repository: ${{ env.ECR_REPOSITORY }}
          registry: ${{ steps.publish-ecr-login.outputs.registry }}
          local-image: h2o-prod:${{ github.sha }}
          tag: ${{ github.sha }}

      # The ORAS project's own action, pinned to a commit like other third-party actions
      # here, so a compromised tag cannot arrive silently in the job that has
      # just authenticated to ECR and can push to it. It verifies the checksum
      # of the binary it downloads against its own table.
      #
      # Which ORAS it installs is the action's default rather than a version
      # named here, so that dependabot maintains the whole thing: a version
      # pinned in this file would be a string nothing watches. Nothing below
      # depends on a particular ORAS -- `attach`, `--artifact-type` and
      # `--annotation` long predate any version this action offers.
      - name: Install oras
        if: steps.web-publication.outputs.state == 'absent'
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      # `image-artifacts/static` and `image-artifacts/migrations.json` are on the
      # runner from the extraction step near the top of this job, and the image
      # they were read out of has just been pushed. Attaching them to that image
      # as OCI referrers is what lets a deploy learn what an image contains --
      # which assets to publish, which migrations it expects -- without starting
      # it or pulling it. ECR answers the referrers API natively and filters by
      # artifact type server-side, so a reader fetches one of these with three
      # requests and no oras binary.
      #
      # Nothing publishes the static files to S3 here. The two `aws s3 sync`
      # calls that ran in this job wrote the production bucket from every build
      # of main, including builds of commits that were never deployed; the
      # bucket is the deploy's to write, from these referrers.
      - name: Attach the static files and migration list to the pushed image
        if: steps.web-publication.outputs.state == 'absent'
        env:
          REGISTRY: ${{ steps.publish-ecr-login.outputs.registry }}
          DIGEST: ${{ steps.publish-web.outputs.digest }}
          MIGRATIONS_TYPE: application/vnd.harvard-lil.h2o.migrations.v1+json
          STATIC_TYPE: application/vnd.harvard-lil.h2o.staticassets.v1.tar+gzip
        run: |
          set -euxo pipefail

          IMAGE="${REGISTRY}/${ECR_REPOSITORY}@${DIGEST}"

          # Sorted names and zeroed mtimes, owners and gzip header, so one image
          # produces one tarball: the bytes decide the blob digest, and the blob
          # digest decides whether a re-attach is the same referrer or a second
          # one.
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            -cf - -C image-artifacts static | gzip -n > static-assets.tar.gz

          # oras stamps org.opencontainers.image.created with the current time
          # unless it is given one, which makes every attach of identical
          # content a distinct referrer. A fixed value keeps attach idempotent.
          oras attach --artifact-type "$MIGRATIONS_TYPE" \
            --annotation "org.opencontainers.image.created=1970-01-01T00:00:00Z" \
            "$IMAGE" image-artifacts/migrations.json:application/json

          oras attach --artifact-type "$STATIC_TYPE" \
            --annotation "org.opencontainers.image.created=1970-01-01T00:00:00Z" \
            "$IMAGE" static-assets.tar.gz:application/gzip

      - name: Verify the completed web publication
        id: verify-web-publication
        if: steps.web-publication.outputs.state == 'absent'
        uses: harvard-lil/lil-actions/ecr-publication-state@main
        with:
          repository: ${{ env.ECR_REPOSITORY }}
          tag: ${{ github.sha }}
          registry: ${{ steps.publish-ecr-login.outputs.registry }}
          required-artifact-types: >-
            ["application/vnd.harvard-lil.h2o.migrations.v1+json",
             "application/vnd.harvard-lil.h2o.staticassets.v1.tar+gzip"]

      - name: Require a complete web publication
        if: >-
          steps.verify-web-publication.outcome == 'success' &&
          steps.verify-web-publication.outputs.state != 'complete'
        env:
          STATE: ${{ steps.verify-web-publication.outputs.state }}
          MISSING: ${{ steps.verify-web-publication.outputs.missing-artifact-types }}
        run: |
          echo "::error::Web publication ended in state '$STATE'."
          echo "::error::Missing referrer types: $MISSING"
          exit 1

      # Build and publish only -- pointing a Lambda at this image is a deploy,
      # and happens in staging.yml / prod.yml alongside every other deploy.
      # Doing it here meant staging's export Lambda tracked main's tip while
      # staging's web app ran the last promoted commit, and production's was
      # never updated by anything at all.
      # Authenticated by the OIDC session configured above.
      # Provenance is disabled because Lambda rejects the image index buildx
      # otherwise publishes. Build locally first, then hand that exact image to
      # the shared publication action.
      - name: Build the pandoc-lambda image
        if: steps.lambda-publication.outputs.state == 'absent'
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --provenance false \
            --load \
            --tag "pandoc-lambda:${{ github.sha }}" \
            --file docker/pandoc-lambda/Dockerfile \
            docker/pandoc-lambda

      - name: Publish the pandoc-lambda image
        if: steps.lambda-publication.outputs.state == 'absent'
        uses: harvard-lil/lil-actions/ecr-publish-image@main
        with:
          repository: pandoc-lambda
          registry: ${{ steps.publish-ecr-login.outputs.registry }}
          local-image: pandoc-lambda:${{ github.sha }}
          tag: ${{ github.sha }}
