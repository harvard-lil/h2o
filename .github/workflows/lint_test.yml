name: Lint and Test

on:
  workflow_call:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Run flake8
        run: |
          pip install "$(grep -Eo 'flake8==\S+' web/requirements.txt)"
          flake8 web/ --config web/setup.cfg
          flake8 docker/pandoc-lambda/function/ --config web/setup.cfg
      
      - name: Run black
        run: |
          pip install "$(grep -Eo 'black==\S+' web/requirements.txt)"
          black --check --diff .
      
      - name: Run mypy
        run: |
          cd web
          pip install -r requirements.txt
          PYTHONPATH=. mypy

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    env:
      # Compose reads this itself, so every `docker compose` call below picks up
      # both files with no flags. Setting it also stops compose auto-loading
      # docker-compose.override.yml, which is developer-only.
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
    # don't run on pushes to forks
    if: github.event_name == 'pull_request' || github.repository == 'harvard-lil/h2o'
    
    steps:
      - uses: actions/checkout@v4
      ### build docker images locally ###
      - name: Rebuild docker images
        id: rebuild
        uses: harvard-lil/lil-actions/docker-compose-update@main

      ### run tests ###
      # docker-compose.ci.yml swaps `web` to the `test` target (FROM prod) and drops
      # the bind mount, so the suite below runs against the image that ships rather
      # than against the source tree. Passing -f also suppresses the automatic
      # docker-compose.override.yml, which is developer-only.
      - name: docker compose up
        run: |
          # separate pull so supporting images download in parallel; the locally
          # built web image is expected to be absent, hence --ignore-pull-failures:
          docker compose pull --ignore-pull-failures || true
          docker compose up -d --build
          docker ps -a                                      # show running containers
          docker compose logs                # show logs

      - name: Collect static files
        shell: 'script -q -e -c "bash --noprofile --norc -eo pipefail {0}"'  # avoid docker-compose "the input device is not a TTY" -- see https://github.com/actions/runner/issues/241#issuecomment-842566950
        run: docker compose exec web ./manage.py collectstatic --noinput   # collect static files

      - name: Python tests
        shell: 'script -q -e -c "bash --noprofile --norc -eo pipefail {0}"'  # avoid docker-compose "the input device is not a TTY" -- see https://github.com/actions/runner/issues/241#issuecomment-842566950
        run: |
          set -x
          docker compose exec web pytest \
            --cov --cov-config=setup.cfg --cov-report xml  `# write coverage data to .coverage for upload by codecov` \
            -vv -n auto --dist loadgroup

      - name: Javascript tests
        shell: 'script -q -e -c "bash --noprofile --norc -eo pipefail {0}"'  # avoid docker-compose "the input device is not a TTY" -- see https://github.com/actions/runner/issues/241#issuecomment-842566950
        run: |
          set -x
          docker compose exec web bash -c "umask 0 && mkdir /app/web/.npmcache && npm config set cache /app/web/.npmcache && npm install"
          docker compose exec web npm run lint
          docker compose exec web npm run build
          docker compose exec web npm run test

      # With the bind mount gone, anything the suite produces lives inside the
      # container. Copy the three things later steps need back onto the host:
      # coverage for codecov, and the built JS assets that "Commit Assets" pushes
      # to main (the prod image never runs npm -- it ships these committed
      # files, so CI producing them is load-bearing, not incidental).
      - name: Extract build artifacts from the test container
        run: |
          set -euxo pipefail
          CID=$(docker compose ps -q web)
          test -n "$CID"

          # Replace rather than merge, so a file deleted by the build doesn't
          # survive on the host and get committed back.
          rm -rf web/static/dist
          mkdir -p web/static/dist
          docker cp "$CID:/app/web/static/dist/." web/static/dist/
          docker cp "$CID:/app/web/webpack-stats.json" web/webpack-stats.json
          docker cp "$CID:/app/web/coverage.xml" web/coverage.xml

          # Fail closed: silently missing assets would be committed as deletions.
          test -s web/webpack-stats.json
          test -s web/coverage.xml
          test -n "$(ls -A web/static/dist)"

      ### codecov ###
      # https://github.com/codecov/codecov-action
      - name: Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      # Commit built assets if necessary
      - name: Commit Assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: 'script -q -e -c "bash --noprofile --norc -eo pipefail {0}"'  # avoid docker-compose "the input device is not a TTY" -- https://github.com/actions/runner/issues/241#issuecomment-842566950
        run: |
          set -x
          git config user.email "lil@law.harvard.edu"
          git config user.name "Github Actions"
          if [[ `git status docker-compose.yml docker-compose.override.yml --porcelain` ]] ; then
            git add docker-compose.yml docker-compose.override.yml
            git commit -m "Bump image version [skip ci]"
            git push origin main || exit 1
          fi
          if [[ `git status web/static/dist/ web/webpack-stats.json --porcelain` ]] ; then
              git add web/static/dist/ web/webpack-stats.json
              git commit -m "Add built JS [skip ci]"
              git push origin main || exit 1
          fi

      ### push docker images to registry, from main branch, once tests pass ###

      - name: Push docker images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: harvard-lil/lil-actions/docker-compose-update@main
        with:
          registry: "ghcr.io"
          registry-user: ${{ github.actor }}
          registry-pass: ${{ secrets.GITHUB_TOKEN }}
          bake-action: "push"

      # Ordering: everything that publishes an artifact runs before anything
      # that deploys one. Publishing is gated on the suite passing and nothing
      # else, so a failed deployment must not also prevent a tested image from
      # being published. The reverse order meant a single AccessDenied on Lambda
      # skipped the GHCR push and the prod image as well.

      # One OIDC session for everything below that touches AWS. Replaces the
      # long-lived AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY this workflow used
      # to carry for the pandoc-lambda publish.
      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v6.1.1
        with:
          role-to-assume: ${{ secrets.STAGING_AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.STAGING_AWS_REGION }}

      # build, push, and deploy pandoc-lambda image to stage if necessary
      ### build and publish the deployable prod artifact ###
      # ecs-build tags both :latest and :<commit sha>. Staging later resolves that
      # SHA tag to a digest and deploys it, so the artifact tested here is the one
      # that ships. target: prod is required -- this Dockerfile is multi-stage and
      # its last stage is `test`, which would otherwise be what gets pushed.
      - name: Build and publish prod-target image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: harvard-lil/lil-actions/ecs-build@main
        with:
          ecr-repository: ${{ secrets.STAGING_ECR_REPOSITORY }}
          target: prod      # Authenticated by the OIDC session configured above.
      # provenance: false because buildx's container driver otherwise attaches a
      # provenance attestation, making the push an image index -- which Lambda
      # rejects. ecs-build also tags the full commit SHA, where this previously
      # used a short SHA.
      # TODO: this could potentially use existing built image
      - name: Build and publish pandoc-lambda image
        id: pandoc-lambda
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(steps.rebuild.outputs.services-rebuilt, 'pandoc-lambda')
        uses: harvard-lil/lil-actions/ecs-build@main
        with:
          ecr-repository: pandoc-lambda
          context: docker/pandoc-lambda
          dockerfile: docker/pandoc-lambda/Dockerfile
          provenance: "false"

      - name: Point the staging Lambda at the new image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(steps.rebuild.outputs.services-rebuilt, 'pandoc-lambda')
        env:
          IMAGE_URI: ${{ steps.pandoc-lambda.outputs.sha-image-uri }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_DEFAULT_REGION: ${{ secrets.STAGING_AWS_REGION }}
        run: |
          set -euxo pipefail
          aws lambda update-function-code \
            --function-name "arn:aws:lambda:${AWS_DEFAULT_REGION}:${AWS_ACCOUNT_ID}:function:h2o-export-stage" \
            --image-uri "$IMAGE_URI" \
            --region "$AWS_DEFAULT_REGION"

