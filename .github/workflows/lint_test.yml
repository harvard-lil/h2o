name: Lint and Test

on:
  workflow_call:
    secrets:
      # Declared so a caller can pass exactly what a given event needs. A
      # pull_request run gets only CODECOV_TOKEN; publishing secrets are
      # required=false and simply absent there, which is what keeps the
      # publish steps unable to run even if their `if:` guards were wrong.
      CODECOV_TOKEN:
        required: false
      STAGING_AWS_ROLE_TO_ASSUME:
        required: false
      STAGING_AWS_REGION:
        required: false
      STAGING_ECR_REPOSITORY:
        required: false
      AWS_ACCOUNT_ID:
        required: false

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Run flake8
        run: |
          pip install "$(grep -Eo 'flake8==\S+' web/requirements.txt)"
          flake8 web/ --config web/setup.cfg
          flake8 docker/pandoc-lambda/function/ --config web/setup.cfg
      
      - name: Run black
        run: |
          pip install "$(grep -Eo 'black==\S+' web/requirements.txt)"
          black --check --diff .
      
      - name: Run mypy
        run: |
          cd web
          pip install -r requirements.txt
          PYTHONPATH=. mypy

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    env:
      # Compose reads this itself, so every `docker compose` call below picks up
      # both files with no flags. Setting it also stops compose auto-loading
      # docker-compose.override.yml, which is developer-only.
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
    # don't run on pushes to forks
    if: github.event_name == 'pull_request' || github.repository == 'harvard-lil/h2o'
    
    steps:
      - uses: actions/checkout@v4
      # Cached with type=gha, which inherits GitHub's cache scoping: a pull
      # request can read main's cache but writes only to its own, so a fork
      # cannot feed layers into a published image. This matters more now that
      # nothing is pulled -- CI builds these every run.
      #
      # Build the deployable image and the image the suite runs against in one
      # go. `test` is FROM `prod`, so this produces prod's layers once and tests
      # against exactly them -- the two cannot drift the way they did when the
      # prod image was rebuilt separately after the tests had already passed.
      #
      # Nothing is pushed here. The prod image is held locally and published
      # further down, only if the suite is green.
      - name: Build the prod and test images
        run: |
          set -euxo pipefail
          docker buildx build \
            --target prod \
            --load \
            --cache-from type=gha,scope=h2o \
            --cache-to type=gha,mode=max,scope=h2o \
            -t h2o-prod:${{ github.sha }} \
            -f ./Dockerfile .

          # `test` reuses the prod layers just built, so this is nearly free.
          docker buildx build \
            --target test \
            --load \
            --cache-from type=gha,scope=h2o \
            -t h2o-test:ci \
            -f ./Dockerfile .

      - name: docker compose up
        run: |
          docker compose pull --ignore-pull-failures || true
          docker compose up -d
          docker ps -a
          docker compose logs

      - name: Collect static files
        shell: 'script -q -e -c "bash --noprofile --norc -eo pipefail {0}"'  # avoid docker-compose "the input device is not a TTY" -- see https://github.com/actions/runner/issues/241#issuecomment-842566950
        run: docker compose exec web ./manage.py collectstatic --noinput   # collect static files

      - name: Python tests
        shell: 'script -q -e -c "bash --noprofile --norc -eo pipefail {0}"'  # avoid docker-compose "the input device is not a TTY" -- see https://github.com/actions/runner/issues/241#issuecomment-842566950
        run: |
          set -x
          docker compose exec web pytest \
            --cov --cov-config=setup.cfg --cov-report xml  `# write coverage data to .coverage for upload by codecov` \
            -vv -n auto --dist loadgroup

      - name: Javascript tests
        shell: 'script -q -e -c "bash --noprofile --norc -eo pipefail {0}"'  # avoid docker-compose "the input device is not a TTY" -- see https://github.com/actions/runner/issues/241#issuecomment-842566950
        run: |
          set -x
          # No npm install or npm run build: node_modules and the compiled
          # bundles both come from the assets stage, inside the image.
          docker compose exec web npm run lint
          docker compose exec web npm run test

      ### codecov ###
      # https://github.com/codecov/codecov-action
      - name: Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      # One OIDC session for everything below that touches AWS. Replaces the
      # long-lived AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY this workflow used
      # to carry for the pandoc-lambda publish.
      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v6.1.1
        with:
          role-to-assume: ${{ secrets.STAGING_AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.STAGING_AWS_REGION }}

      - name: Login to AWS ECR
        id: publish-ecr-login
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2.1.4

      # Push the image built at the top of this job -- not a rebuild. Tagged with
      # the commit main actually points at, so staging can find it.
      - name: Publish the prod image to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY: ${{ steps.publish-ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.STAGING_ECR_REPOSITORY }}
        run: |
          set -euxo pipefail
          # Nothing commits to main any more, so github.sha *is* main's tip and
          # staging can resolve it directly. This is what the post-commit SHA
          # dance was working around.
          docker tag "h2o-prod:${{ github.sha }}" "${REGISTRY}/${ECR_REPOSITORY}:${{ github.sha }}"
          docker push "${REGISTRY}/${ECR_REPOSITORY}:${{ github.sha }}"

      # build, push, and deploy pandoc-lambda image to stage if necessary
      # Authenticated by the OIDC session configured above.
      # provenance: false because buildx's container driver otherwise attaches a
      # provenance attestation, making the push an image index -- which Lambda
      # rejects. ecs-build also tags the full commit SHA, where this previously
      # used a short SHA.
      # TODO: this could potentially use existing built image
      - name: Build and publish pandoc-lambda image
        id: pandoc-lambda
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: harvard-lil/lil-actions/ecs-build@main
        with:
          ecr-repository: pandoc-lambda
          context: docker/pandoc-lambda
          dockerfile: docker/pandoc-lambda/Dockerfile
          provenance: "false"

      - name: Point the staging Lambda at the new image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_URI: ${{ steps.pandoc-lambda.outputs.sha-image-uri }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_DEFAULT_REGION: ${{ secrets.STAGING_AWS_REGION }}
        run: |
          set -euxo pipefail
          aws lambda update-function-code \
            --function-name "arn:aws:lambda:${AWS_DEFAULT_REGION}:${AWS_ACCOUNT_ID}:function:h2o-export-stage" \
            --image-uri "$IMAGE_URI" \
            --region "$AWS_DEFAULT_REGION"

