name: Lint and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: h2o-build-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  # Pull requests only ever test. No publishing, so no publishing credentials:
  # a read-only token and one named secret, rather than `secrets: inherit`
  # handing the whole repository's secrets to a branch build.
  test:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/lint_test.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # A new commit on main runs the same suite and then publishes. A retry first
  # verifies the immutable image and its required referrers; a complete
  # publication is reused without rebuilding or retesting it.
  test-and-publish:
    if: github.event_name == 'push'
    permissions:
      id-token: write   # assume the staging AWS role
      contents: read    # nothing commits back to main any more
    uses: ./.github/workflows/lint_test.yml
    secrets: inherit
