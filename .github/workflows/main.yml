name: Lint and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write   # assume the staging AWS role to publish the prod-target image
  contents: write   # lint_test.yml commits built assets back to main
  packages: write   # push images to ghcr.io/harvard-lil

jobs:
  lint-and-test:
    uses: ./.github/workflows/lint_test.yml
    secrets: inherit