name: ECS deploy sequence

# Everything both tiers do identically once the artifact to deploy has been
# identified: register a pinned task definition, publish the static files the
# artifact carries, roll the service, deploy the export Lambda, run the
# post-deploy commands behind a maintenance window, and report the result.
#
# Sharing it means a staging deploy exercises the same code a production deploy
# will run, rather than a second copy of it that happens to look the same.
#
# What differs by tier stays in the caller: how the artifact is identified and
# how it is marked as this tier's. Both tiers run images out of the one `h2o`
# repository, so that no longer differs.
#
# Values arrive as secrets today because that is how the callers already hold
# them. Most are not secrets -- cluster, service and target-group names are
# identifiers, and masking them makes a failed deploy harder to read. Moving
# those to inputs is a change to the header of this file and to the callers'
# mapping blocks; every step below reads `env`, so none of them would change.

on:
  workflow_call:
    inputs:
      environment-label:
        description: 'Name for this tier in notifications, e.g. Staging'
        required: true
        type: string
      image-digest:
        description: >
          Digest of the web image to deploy, already present in the `h2o` ECR
          repository. A digest and not a full URI: a URI contains the registry,
          the registry contains the account ID, the account ID is masked, and
          GitHub silently drops a job output it believes holds a secret rather
          than passing it on.
        required: true
        type: string
      source-sha:
        description: 'Commit the artifact was built from, naming the matching pandoc-lambda image'
        required: true
        type: string
      environment:
        description: >
          GitHub environment this tier deploys to. It carries the tier's
          variables and secrets, and its branch policy is what stops another
          branch reaching them, so naming it here is what selects the tier.
        required: true
        type: string

    secrets:
      # A called workflow's secrets context is only what the caller passes it.
      # Naming an environment here supplies that environment's variables, and
      # everything the tier differs by is one, so what is left to pass is the
      # two values that are secret and the same for every tier.
      cloudflare-api-token:
        required: true
      slack-webhook-url:
        required: true

permissions:
  id-token: write     # assume the deploy role via OIDC
  contents: read
  pull-requests: read # read deploy labels off the merged pull request

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment-label }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    env:
      # One repository holds every h2o image both tiers run.
      ECR_REPOSITORY: h2o
      TASK_DEFINITION_FAMILY: ${{ vars.TASK_DEFINITION_FAMILY }}
      CONTAINER_NAME: ${{ vars.CONTAINER_NAME }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
      EVENT_RULES: ${{ vars.EVENT_RULES }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      # The registry is derived here rather than passed in, for the same reason
      # the inputs above are pieces rather than URIs.
      - name: Login to AWS ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Pin the web container to the promoted digest
        id: task-def
        uses: harvard-lil/lil-actions/ecs-register-task-def@main
        with:
          task-definition-family: ${{ env.TASK_DEFINITION_FAMILY }}
          container-name: ${{ env.CONTAINER_NAME }}
          image-uri: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}@${{ inputs.image-digest }}

      - name: Fetch the published static files and migration manifest
        uses: harvard-lil/lil-actions/ecr-artifacts@main
        with:
          mode: fetch
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}@${{ inputs.image-digest }}
          artifacts: >-
            [{"type":"application/vnd.harvard-lil.h2o.migrations.v1+json","path":"image-artifacts/migrations.json"},
             {"type":"application/vnd.harvard-lil.h2o.staticassets.v1.tar+gzip","path":"static-assets.tar.gz"}]
      - name: Unpack the published static files
        run: tar -xzf static-assets.tar.gz -C image-artifacts

      # Every version's assets live together in one bucket, so a browser holding
      # a page from an earlier deploy can still fetch its bundles. Objects are
      # only ever added: there is no --delete here and there should not be, since
      # removing an old hash is what this exists to prevent.
      #
      # Two passes, because the cache headers differ by whether the filename
      # carries a content hash. Everything under dist/ does, so it can be
      # immutable for a year; Django admin's files and anything else collected
      # alongside them do not, and would go stale for a year if treated the same.
      #
      # Above the rollout, because a task that starts before its bundles are in
      # the bucket serves pages referencing hashes that 404.
      - name: Publish the image's static files
        env:
          # h2o-static was already taken in S3's global namespace by another
          # account, so the bucket is org-scoped. h2o/static in lil-terraform
          # outputs this name. One bucket serves both tiers, as it did when
          # every build of main wrote it.
          STATIC_BUCKET: lil-h2o-static
        run: |
          set -euxo pipefail
          aws s3 sync image-artifacts/static/dist "s3://${STATIC_BUCKET}/static/dist" \
            --cache-control 'public, max-age=31536000, immutable' --no-progress

          aws s3 sync image-artifacts/static "s3://${STATIC_BUCKET}/static" \
            --exclude 'dist/*' \
            --cache-control 'public, max-age=3600' --no-progress

      # A push carries no pull request context, so the labels are looked up from
      # the commit. A direct push, or a merge whose pull request has since been
      # deleted, returns nothing and the deploy proceeds on its own judgement.
      - name: Read the deploy labels off the merged pull request
        id: labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          if ! labels="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
                          --jq '.[].labels[].name')"; then
            echo "::warning::Could not read pull request labels for ${GITHUB_SHA}."
            echo "::warning::Continuing as though none were set."
            labels=""
          fi
          echo "Labels: ${labels:-(none)}"
          if grep -qx 'deploy:force-maintenance-mode' <<< "$labels"; then
            echo "force-maintenance=true" >> "$GITHUB_OUTPUT"
          else
            echo "force-maintenance=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -qx 'deploy:skip-maintenance-mode' <<< "$labels"; then
            echo "skip-maintenance=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip-maintenance=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Does this deploy need a maintenance window?
        id: window
        uses: harvard-lil/lil-actions/ecs-django-maintenance@main
        with:
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          container: ${{ env.CONTAINER_NAME }}
          settings-module: config.settings
          manifest: image-artifacts/migrations.json
          force: ${{ steps.labels.outputs.force-maintenance }}
          skip: ${{ steps.labels.outputs.skip-maintenance }}

      - name: Deploy the digest-pinned task definition
        uses: harvard-lil/lil-actions/ecs-deploy@main
        with:
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          task-definition: ${{ steps.task-def.outputs.task-definition-arn }}

      # Held at Cloudflare's edge, so the page still answers if the origin is
      # unreachable. The action confirms the change by requesting the site and
      # fails if it never sees it, so the migration below does not start against
      # traffic that is still flowing.
      - name: Hold traffic at the edge
        if: steps.window.outputs.needed == 'true'
        uses: harvard-lil/lil-actions/cloudflare-maintenance@main
        with:
          mode: 'on'
          zone-id: ${{ vars.CLOUDFLARE_ZONE_ID }}
          script: ${{ vars.MAINTENANCE_SCRIPT }}
          hostnames: ${{ vars.MAINTENANCE_HOSTNAMES }}
          token: ${{ secrets.cloudflare-api-token }}

      - name: Wait for the requested revision to become stable
        uses: harvard-lil/lil-actions/ecs-wait-for-deployment@main
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition-arn }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}

      - name: Run Django migrations
        id: migrate
        uses: harvard-lil/lil-actions/ecs-django-migrations@main
        with:
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          container: ${{ env.CONTAINER_NAME }}
          migrate-command: 'python manage.py migrate --noinput'
          task-definition: ${{ steps.task-def.outputs.task-definition-arn }}

      - name: Align Terraform's placeholder with the verified image
        uses: harvard-lil/lil-actions/ecr-tag-image@main
        with:
          repository: ${{ env.ECR_REPOSITORY }}
          source: ${{ inputs.image-digest }}
          tag: ${{ inputs.environment }}-latest
          replace-existing: 'true'

      # Lifted whenever migrations either succeeded or never ran, which covers
      # every failure above this point. Those all leave a working site
      # underneath: the service runs at minimumHealthyPercent 100, so ECS keeps
      # the previous tasks serving until replacements pass health checks, and
      # the only thing making the site unreachable is this page.
      #
      # A migration that failed partway is the exception, since it can leave the
      # schema in a state neither the old nor the new code is safe against. That
      # case stays behind the maintenance page for a human. `cancelled` counts
      # the same: interrupting a migration is no safer than one failing.
      - name: Release traffic at the edge
        if: always() && steps.window.outputs.needed == 'true' && (steps.migrate.outcome == 'success' || steps.migrate.outcome == 'skipped')
        uses: harvard-lil/lil-actions/cloudflare-maintenance@main
        with:
          mode: 'off'
          zone-id: ${{ vars.CLOUDFLARE_ZONE_ID }}
          hostnames: ${{ vars.MAINTENANCE_HOSTNAMES }}
          token: ${{ secrets.cloudflare-api-token }}

      # Complement of the condition above, so the site is never left behind the
      # maintenance page without this saying so.
      - name: Report that the site was left in maintenance
        if: always() && steps.window.outputs.needed == 'true' && steps.migrate.outcome != 'success' && steps.migrate.outcome != 'skipped'
        run: |
          echo "::error::Django migrations did not complete (outcome: ${{ steps.migrate.outcome }})."
          echo "::error::MAINTENANCE MODE IS STILL ON and was left on deliberately --"
          echo "::error::${{ vars.SITE_URL }} is serving the maintenance page, not the application."
          echo "::error::The database may be partially migrated. Check its state before"
          echo "::error::lifting maintenance; re-running this workflow will not lift it"
          echo "::error::either, because it will fail at the same step."
          exit 1

      - name: Purge Cloudflare cache
        uses: harvard-lil/lil-actions/cloudflare-purge@main
        with:
          zone: ${{ vars.CLOUDFLARE_ZONE_ID }}
          token: ${{ secrets.cloudflare-api-token }}

      # Everything from here down runs with the site already serving. None of it
      # is needed for a page to render: the new tasks are healthy and the schema
      # is migrated by this point, and on a deploy that takes no window these
      # commands run against live traffic anyway. Keeping them above the release
      # would spend their runtime as downtime.
      - name: Create search index
        uses: harvard-lil/lil-actions/ecs-exec-command@main
        with:
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          container: ${{ env.CONTAINER_NAME }}
          command: 'invoke create-search-index'

      - name: Create reporting views
        uses: harvard-lil/lil-actions/ecs-exec-command@main
        with:
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          container: ${{ env.CONTAINER_NAME }}
          command: 'invoke create-reporting-views'

      - name: Update scheduled tasks with new task definition
        uses: harvard-lil/lil-actions/ecs-update-eventbridge@main
        with:
          event-rules: ${{ env.EVENT_RULES }}
          task-definition-arn: ${{ steps.task-def.outputs.task-definition-arn }}

      # The export Lambda is part of this application and ships with it, from the
      # same commit as the web service. Deploying it anywhere else lets the two
      # drift apart.
      #
      # It goes last because exports failing matters less than the web deploy:
      # here, a pandoc-lambda image missing for this commit fails one step with
      # everything else already done, rather than stopping the rollout partway.
      - name: Point the export Lambda at the promoted image
        env:
          FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION_NAME }}
          LAMBDA_IMAGE_URI: ${{ steps.login-ecr.outputs.registry }}/pandoc-lambda:${{ inputs.source-sha }}
        run: |
          set -euxo pipefail
          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --image-uri "$LAMBDA_IMAGE_URI" >/dev/null
          
          
      # The success notification below does not run on failure, so this is the
      # only thing that reports a failed deploy -- including the one case where
      # the site is deliberately left serving the maintenance page.
      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
            webhook: ${{ secrets.slack-webhook-url }}
            webhook-type: incoming-webhook
            payload: |
              {
                "blocks": [
                    {
                      "type": "section",
                      "text": {
                          "type": "mrkdwn",
                          "text": "*${{ inputs.environment-label }} H2O deploy FAILED*"
                      }
                    },
                    {
                      "type": "section",
                      "text": {
                          "type": "mrkdwn",
                          "text": "*Maintenance mode:*\n${{ (steps.window.outputs.needed == 'true' && steps.migrate.outcome != 'success' && steps.migrate.outcome != 'skipped') && 'STILL ON - the site is serving the maintenance page' || (steps.window.outputs.needed == 'true' && 'lifted - the site is serving the previous version' || 'never opened - no migrations, the site stayed up throughout') }}\n*Run:*\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.run_id }}>"
                      }
                    }
                ]
              }

      - name: Notify Slack
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
            webhook: ${{ secrets.slack-webhook-url }}
            webhook-type: incoming-webhook
            payload: |
              {
                "blocks": [
                    {
                      "type": "section",
                      "text": {
                          "type": "mrkdwn",
                          "text": "*${{ inputs.environment-label }} H2O deployed successfully!*"
                      }
                    },
                    {
                    "type": "section",
                      "text": {
                          "type": "mrkdwn",
                          "text": "*Repo:*\n<https://github.com/${{ github.repository }}|`${{ github.repository }}`>\n*Branch:*\n<https://github.com/${{ github.repository }}/tree/${{ github.ref_name }}|`${{ github.ref_name }}`>\n*Commit:*\n<https://github.com/${{ github.repository }}/commit/${{ github.sha }}|`${{ github.sha }}`>"
                      } 
                    },
                    {
                    "type": "section",
                      "text": {
                          "type": "mrkdwn",
                          "text": "*View the site:* <${{ vars.SITE_URL }}|${{ vars.SITE_URL }}>"
                      }
                    }
                ]
              }