name: ECS deploy sequence

# Everything both tiers do identically once the artifact to deploy has been
# identified: register a pinned task definition, publish the static files the
# artifact carries, roll the service, deploy the export Lambda, run the
# post-deploy commands behind a maintenance window, and report the result.
#
# Sharing it means a staging deploy exercises the same code a production deploy
# will run, rather than a second copy of it that happens to look the same.
#
# What differs by tier stays in the caller: how the artifact is identified and
# how it is marked as this tier's. Both tiers run images out of the one `h2o`
# repository, so that no longer differs.
#
# Values arrive as secrets today because that is how the callers already hold
# them. Most are not secrets -- cluster, service and target-group names are
# identifiers, and masking them makes a failed deploy harder to read. Moving
# those to inputs is a change to the header of this file and to the callers'
# mapping blocks; every step below reads `env`, so none of them would change.

on:
  workflow_call:
    inputs:
      environment-label:
        description: 'Name for this tier in notifications, e.g. Staging'
        required: true
        type: string
      image-digest:
        description: >
          Digest of the web image to deploy, already present in the `h2o` ECR
          repository. A digest and not a full URI: a URI contains the registry,
          the registry contains the account ID, the account ID is masked, and
          GitHub silently drops a job output it believes holds a secret rather
          than passing it on.
        required: true
        type: string
      source-sha:
        description: 'Commit the artifact was built from, naming the matching pandoc-lambda image'
        required: true
        type: string
      environment:
        description: >
          GitHub environment this tier deploys to. It carries the tier's
          variables and secrets, and its branch policy is what stops another
          branch reaching them, so naming it here is what selects the tier.
        required: true
        type: string

    secrets:
      # A called workflow's secrets context is only what the caller passes it.
      # Naming an environment here supplies that environment's variables, and
      # everything the tier differs by is one, so what is left to pass is the
      # two values that are secret and the same for every tier.
      cloudflare-api-token:
        required: true
      slack-webhook-url:
        required: true

permissions:
  id-token: write     # assume the deploy role via OIDC
  contents: read
  pull-requests: read # read deploy labels off the merged pull request

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment-label }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    env:
      # One repository holds every h2o image both tiers run.
      ECR_REPOSITORY: h2o
      TASK_DEFINITION_FAMILY: ${{ vars.TASK_DEFINITION_FAMILY }}
      CONTAINER_NAME: ${{ vars.CONTAINER_NAME }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
      EVENT_RULES: ${{ vars.EVENT_RULES }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      # The registry is derived here rather than passed in, for the same reason
      # the inputs above are pieces rather than URIs.
      - name: Login to AWS ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Pin the web container to the promoted digest
        id: task-def
        uses: harvard-lil/lil-actions/ecs-register-task-def@main
        with:
          task-definition-family: ${{ env.TASK_DEFINITION_FAMILY }}
          container-name: ${{ env.CONTAINER_NAME }}
          image-uri: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}@${{ inputs.image-digest }}

      # The build collected the static files and wrote the migration list into
      # the image, then attached both to the image's digest as OCI referrers.
      # Reading them here ties the assets that get published, and the answer the
      # window decision is made from, to the exact bytes being deployed.
      #
      # Three requests fetch one: the referrers index for this digest filtered
      # by artifact type, the manifest it names, then that manifest's one layer.
      # ECR filters server-side and says so with OCI-Filters-Applied; the jq
      # select repeats the filter because a registry may ignore it and answer
      # with everything.
      #
      # The fallback reads the image itself. `regctl image get-file` would pull
      # a single path without a full pull, but it extracts files and not
      # directories, and the static tree is a directory -- so a fallback that
      # covers both is a pull, and the migration list comes out of the same
      # container for free. Both tiers deploy the digest the build attached the
      # referrers to, in the repository it attached them in -- production
      # promotes by adding a tag rather than copying -- so the fallback is for
      # an image whose referrers are missing or unreadable, not for a tier.
      - name: Read the image's static files and migration list
        id: artifacts
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_DIGEST: ${{ inputs.image-digest }}
          MIGRATIONS_TYPE: application/vnd.harvard-lil.h2o.migrations.v1+json
          STATIC_TYPE: application/vnd.harvard-lil.h2o.staticassets.v1.tar+gzip
        run: |
          set -uo pipefail

          rm -rf image-artifacts
          mkdir -p image-artifacts
          ECR_PASSWORD="$(aws ecr get-login-password)"

          # $1 path under /v2/<repo>/, $2 Accept, $3 output file. Basic auth
          # with the ECR token; -L for the blob endpoint, which answers with a
          # 307 to S3. curl drops the credentials on a redirect to another host,
          # which is what the presigned URL there wants.
          registry_get() {
            curl -sSfL --retry 3 --retry-delay 2 \
              -H "Accept: $2" -u "AWS:${ECR_PASSWORD}" -o "$3" \
              "https://${REGISTRY}/v2/${ECR_REPOSITORY}/$1"
          }

          # $1 artifact type, $2 destination. Writes the referrer's single layer
          # to the destination, or explains why there is nothing to write.
          fetch_referrer() {
            artifact_type="$1"
            destination="$2"
            encoded="$(jq -rn --arg t "$artifact_type" '$t|@uri')"

            if ! registry_get "referrers/${IMAGE_DIGEST}?artifactType=${encoded}" \
                 'application/vnd.oci.image.index.v1+json' referrers.json; then
              echo "No referrers index for ${artifact_type}."
              return 1
            fi
            referrer="$(jq -r --arg t "$artifact_type" \
              'first(.manifests[]? | select(.artifactType == $t) | .digest) // empty' \
              referrers.json 2>/dev/null || true)"
            if [ -z "$referrer" ]; then
              echo "The referrers index names nothing of type ${artifact_type}."
              return 1
            fi

            if ! registry_get "manifests/${referrer}" \
                 'application/vnd.oci.image.manifest.v1+json' referrer-manifest.json; then
              echo "Could not read referring manifest ${referrer}."
              return 1
            fi
            layer="$(jq -r 'first(.layers[]?.digest) // empty' \
              referrer-manifest.json 2>/dev/null || true)"
            if [ -z "$layer" ]; then
              echo "Referring manifest ${referrer} carries no layer."
              return 1
            fi

            if ! registry_get "blobs/${layer}" '*/*' "$destination"; then
              echo "Could not read blob ${layer}."
              return 1
            fi
            echo "${artifact_type} <- ${referrer}"
            return 0
          }

          static_source=""
          migrations_source=""

          if fetch_referrer "$STATIC_TYPE" static-assets.tar.gz; then
            mkdir -p image-artifacts/static
            if tar -xzf static-assets.tar.gz -C image-artifacts; then
              static_source="referrer"
            else
              echo "::warning::The static assets referrer did not unpack."
              rm -rf image-artifacts/static
            fi
          fi

          if fetch_referrer "$MIGRATIONS_TYPE" image-artifacts/migrations.json; then
            if jq -e '.hash' image-artifacts/migrations.json >/dev/null 2>&1; then
              migrations_source="referrer"
            else
              echo "::warning::The migration list referrer is not a manifest document."
              rm -f image-artifacts/migrations.json
            fi
          fi

          if [ -z "$static_source" ] || [ -z "$migrations_source" ]; then
            echo "Reading what is missing out of the image itself."
            IMAGE="${REGISTRY}/${ECR_REPOSITORY}@${IMAGE_DIGEST}"
            container=""
            if docker pull -q "$IMAGE" && container="$(docker create "$IMAGE")"; then
              if [ -z "$static_source" ]; then
                rm -rf image-artifacts/static
                if docker cp "${container}:/app/web/static" image-artifacts/static; then
                  static_source="image"
                fi
              fi
              if [ -z "$migrations_source" ]; then
                if docker cp "${container}:/app/web/migrations.json" \
                     image-artifacts/migrations.json; then
                  migrations_source="image"
                fi
              fi
              docker rm "$container" >/dev/null
            else
              echo "::warning::Could not read ${IMAGE_DIGEST} as an image."
            fi
          fi

          echo "static-source=${static_source:-none}" >> "$GITHUB_OUTPUT"
          echo "migrations-source=${migrations_source:-none}" >> "$GITHUB_OUTPUT"
          echo "Static files: ${static_source:-NOT AVAILABLE}"
          echo "Migration list: ${migrations_source:-NOT AVAILABLE}"

          # Nothing has been deployed yet, so failing here leaves the running
          # version serving. Going on would put tasks in front of traffic that
          # renders pages naming asset hashes the bucket does not hold.
          if [ -z "$static_source" ]; then
            echo "::error::The static files for ${IMAGE_DIGEST} are readable neither"
            echo "::error::from its referrer nor from the image."
            exit 1
          fi
          if [ -z "$migrations_source" ]; then
            echo "::warning::No migration list for ${IMAGE_DIGEST}; the window"
            echo "::warning::decision will be taken without it."
          fi

      # Every version's assets live together in one bucket, so a browser holding
      # a page from an earlier deploy can still fetch its bundles. Objects are
      # only ever added: there is no --delete here and there should not be, since
      # removing an old hash is what this exists to prevent.
      #
      # Two passes, because the cache headers differ by whether the filename
      # carries a content hash. Everything under dist/ does, so it can be
      # immutable for a year; Django admin's files and anything else collected
      # alongside them do not, and would go stale for a year if treated the same.
      #
      # Above the rollout, because a task that starts before its bundles are in
      # the bucket serves pages referencing hashes that 404.
      - name: Publish the image's static files
        env:
          # h2o-static was already taken in S3's global namespace by another
          # account, so the bucket is org-scoped. h2o/static in lil-terraform
          # outputs this name. One bucket serves both tiers, as it did when
          # every build of main wrote it.
          STATIC_BUCKET: lil-h2o-static
        run: |
          set -euxo pipefail
          aws s3 sync image-artifacts/static/dist "s3://${STATIC_BUCKET}/static/dist" \
            --cache-control 'public, max-age=31536000, immutable' --no-progress

          aws s3 sync image-artifacts/static "s3://${STATIC_BUCKET}/static" \
            --exclude 'dist/*' \
            --cache-control 'public, max-age=3600' --no-progress

      # A push carries no pull request context, so the labels are looked up from
      # the commit. A direct push, or a merge whose pull request has since been
      # deleted, returns nothing and the deploy proceeds on its own judgement.
      - name: Read the deploy labels off the merged pull request
        id: labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          if ! labels="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
                          --jq '.[].labels[].name')"; then
            echo "::warning::Could not read pull request labels for ${GITHUB_SHA}."
            echo "::warning::Continuing as though none were set."
            labels=""
          fi
          echo "Labels: ${labels:-(none)}"
          if grep -qx 'deploy:force-maintenance-mode' <<< "$labels"; then
            echo "force-maintenance=true" >> "$GITHUB_OUTPUT"
          else
            echo "force-maintenance=false" >> "$GITHUB_OUTPUT"
          fi

      # A window is needed when the schema the running tasks are serving against
      # is not the schema the new code expects. That is two questions, and both
      # are answered without starting anything: the new image's migration list
      # came out of its referrer above, and a task the service is already
      # running answers for itself over ECS Exec.
      #
      # Equal migration lists mean the new image adds no migrations, which is
      # not yet an answer -- the database can be behind the image already
      # running, from a deploy whose migrations never ran. `migrate --plan` on
      # the running task settles that.
      #
      # `aws ecs execute-command` exits with the status of the SSM session and
      # not of the command it carried, so every answer here is read out of the
      # session's output. lil-actions/ecs-django-migrations reads Django's
      # plan output the same way.
      #
      # Every answer except a clean "nothing to apply" opens the window: no
      # manifest, no running task, a session that will not start, output that
      # says neither thing. Opening a window that was not needed costs five
      # quiet minutes; skipping one that was needed serves traffic against a
      # half-migrated schema.
      - name: Does this deploy need a maintenance window?
        id: window
        env:
          FORCED: ${{ steps.labels.outputs.force-maintenance }}
        run: |
          set -uo pipefail
          needed=true

          # Asked for explicitly, so there is nothing to work out. This is also
          # the only way to exercise the window on a deploy that carries no
          # migrations, which is otherwise the only thing that opens one.
          if [ "$FORCED" = "true" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "deploy:force-maintenance-mode is set: taking a maintenance window."
            exit 0
          fi

          # $1 is a shell command; its output, and the session's chatter around
          # it, come back together on stdout.
          exec_in_running_task() {
            aws ecs execute-command \
              --cluster "$ECS_CLUSTER" --task "$TASK_ARN" --container "$CONTAINER_NAME" \
              --interactive --command "/bin/sh -lc '$1'" 2>&1
          }

          new_hash="$(jq -r '.hash // empty' image-artifacts/migrations.json 2>/dev/null || true)"

          TASK_ARN=""
          if [ -n "$new_hash" ]; then
            TASK_ARN="$(aws ecs list-tasks --cluster "$ECS_CLUSTER" \
              --service-name "$ECS_SERVICE" --desired-status RUNNING \
              --query 'taskArns[0]' --output text 2>/dev/null || true)"
            if [ "$TASK_ARN" = "None" ]; then
              TASK_ARN=""
            fi
          fi

          if [ -z "$new_hash" ]; then
            echo "::warning::The image being deployed carries no migration list."
          elif [ -z "$TASK_ARN" ]; then
            echo "::warning::The service is running no task to compare against."
          else
            echo "Asking ${TASK_ARN##*/} what it has."
            manifest="$(exec_in_running_task 'python manage.py migration_manifest' || true)"
            # The manifest is printed as indented JSON, so its hash is one
            # field on one line, wherever the session chatter put it.
            running_hash="$(printf '%s' "$manifest" | tr -d '\r' \
              | sed -n 's/.*"hash"[[:space:]]*:[[:space:]]*"\([0-9a-f]\{1,\}\)".*/\1/p' \
              | head -n1 || true)"

            if [ -z "$running_hash" ]; then
              echo "::warning::The running task returned no migration list."
              printf '%s\n' "$manifest" | tail -n 20
            elif [ "$running_hash" != "$new_hash" ]; then
              echo "Migration lists differ: the image has ${new_hash}, the running tasks have ${running_hash}."
            else
              echo "Both the image and the running tasks have migration list ${new_hash}."
              plan="$(exec_in_running_task 'python manage.py migrate --plan' || true)"
              if grep -q 'No planned migration operations' <<< "$plan"; then
                needed=false
              elif grep -q 'Planned operations:' <<< "$plan"; then
                echo "The image adds no migrations, but the database is behind the running one."
              else
                echo "::warning::The running task returned no migration plan."
                printf '%s\n' "$plan" | tail -n 20
              fi
            fi
          fi

          echo "needed=$needed" >> "$GITHUB_OUTPUT"
          if [ "$needed" = "true" ]; then
            echo "Migrations to apply, or an inconclusive answer: taking a maintenance window."
          else
            echo "Nothing to apply: deploying without a maintenance window."
          fi

      - name: Deploy the digest-pinned task definition
        uses: harvard-lil/lil-actions/ecs-deploy@main
        with:
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          task-definition: ${{ steps.task-def.outputs.task-definition-arn }}

      # Held at Cloudflare rather than by shifting load-balancer weight, so the
      # page still answers if the origin is unreachable, and the load balancer
      # is left out of it entirely. The action confirms the change by requesting
      # the site and fails if it never sees it, so the migration below does not
      # start against traffic that is still flowing.
      - name: Hold traffic at the edge
        if: steps.window.outputs.needed == 'true'
        uses: harvard-lil/lil-actions/cloudflare-maintenance@main
        with:
          mode: 'on'
          zone-id: ${{ vars.CLOUDFLARE_ZONE_ID }}
          script: ${{ vars.MAINTENANCE_SCRIPT }}
          hostnames: ${{ vars.MAINTENANCE_HOSTNAMES }}
          token: ${{ secrets.cloudflare-api-token }}

      - name: Wait for the new deployment to become stable
        uses: harvard-lil/lil-actions/ecs-wait-for-deployment@main
        with:
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}

      - name: Run Django migrations
        id: migrate
        uses: harvard-lil/lil-actions/ecs-django-migrations@main
        with:
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          container: ${{ env.CONTAINER_NAME }}
          migrate-command: 'python manage.py migrate'

      # Lifted whenever migrations either succeeded or never ran, which covers
      # every failure above this point. Those all leave a working site
      # underneath: the service runs at minimumHealthyPercent 100, so ECS keeps
      # the previous tasks serving until replacements pass health checks, and
      # the only thing making the site unreachable is this page.
      #
      # A migration that failed partway is the exception, since it can leave the
      # schema in a state neither the old nor the new code is safe against. That
      # case stays behind the maintenance page for a human. `cancelled` counts
      # the same: interrupting a migration is no safer than one failing.
      - name: Release traffic at the edge
        if: always() && steps.window.outputs.needed == 'true' && (steps.migrate.outcome == 'success' || steps.migrate.outcome == 'skipped')
        uses: harvard-lil/lil-actions/cloudflare-maintenance@main
        with:
          mode: 'off'
          zone-id: ${{ vars.CLOUDFLARE_ZONE_ID }}
          hostnames: ${{ vars.MAINTENANCE_HOSTNAMES }}
          token: ${{ secrets.cloudflare-api-token }}

      # Complement of the condition above, so the site is never left behind the
      # maintenance page without this saying so.
      - name: Report that the site was left in maintenance
        if: always() && steps.window.outputs.needed == 'true' && steps.migrate.outcome != 'success' && steps.migrate.outcome != 'skipped'
        run: |
          echo "::error::Django migrations did not complete (outcome: ${{ steps.migrate.outcome }})."
          echo "::error::MAINTENANCE MODE IS STILL ON and was left on deliberately --"
          echo "::error::${{ vars.SITE_URL }} is serving the maintenance page, not the application."
          echo "::error::The database may be partially migrated. Check its state before"
          echo "::error::lifting maintenance; re-running this workflow will not lift it"
          echo "::error::either, because it will fail at the same step."
          exit 1

      - name: Purge Cloudflare cache
        uses: harvard-lil/lil-actions/cloudflare-purge@main
        with:
          zone: ${{ vars.CLOUDFLARE_ZONE_ID }}
          token: ${{ secrets.cloudflare-api-token }}

      # Everything from here down runs with the site already serving. None of it
      # is needed for a page to render: the new tasks are healthy and the schema
      # is migrated by this point, and on a deploy that takes no window these
      # commands run against live traffic anyway. Keeping them above the release
      # would spend their runtime as downtime.
      - name: Create search index
        uses: harvard-lil/lil-actions/ecs-exec-command@main
        with:
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          container: ${{ env.CONTAINER_NAME }}
          command: 'invoke create-search-index'

      - name: Create reporting views
        uses: harvard-lil/lil-actions/ecs-exec-command@main
        with:
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          container: ${{ env.CONTAINER_NAME }}
          command: 'invoke create-reporting-views'

      - name: Update scheduled tasks with new task definition
        uses: harvard-lil/lil-actions/ecs-update-eventbridge@main
        with:
          event-rules: ${{ env.EVENT_RULES }}
          task-definition-arn: ${{ steps.task-def.outputs.task-definition-arn }}

      # The export Lambda is part of this application and ships with it, from the
      # same commit as the web service. Deploying it anywhere else lets the two
      # drift apart.
      #
      # It goes last because exports failing matters less than the web deploy:
      # here, a pandoc-lambda image missing for this commit fails one step with
      # everything else already done, rather than stopping the rollout partway.
      - name: Point the export Lambda at the promoted image
        env:
          FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION_NAME }}
          LAMBDA_IMAGE_URI: ${{ steps.login-ecr.outputs.registry }}/pandoc-lambda:${{ inputs.source-sha }}
        run: |
          set -euxo pipefail
          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --image-uri "$LAMBDA_IMAGE_URI" >/dev/null
          
          
      # The success notification below does not run on failure, so this is the
      # only thing that reports a failed deploy -- including the one case where
      # the site is deliberately left serving the maintenance page.
      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
            webhook: ${{ secrets.slack-webhook-url }}
            webhook-type: incoming-webhook
            payload: |
              {
                "blocks": [
                    {
                      "type": "section",
                      "text": {
                          "type": "mrkdwn",
                          "text": "*${{ inputs.environment-label }} H2O deploy FAILED*"
                      }
                    },
                    {
                      "type": "section",
                      "text": {
                          "type": "mrkdwn",
                          "text": "*Maintenance mode:*\n${{ (steps.window.outputs.needed == 'true' && steps.migrate.outcome != 'success' && steps.migrate.outcome != 'skipped') && 'STILL ON - the site is serving the maintenance page' || (steps.window.outputs.needed == 'true' && 'lifted - the site is serving the previous version' || 'never opened - no migrations, the site stayed up throughout') }}\n*Run:*\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.run_id }}>"
                      }
                    }
                ]
              }

      - name: Notify Slack
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
            webhook: ${{ secrets.slack-webhook-url }}
            webhook-type: incoming-webhook
            payload: |
              {
                "blocks": [
                    {
                      "type": "section",
                      "text": {
                          "type": "mrkdwn",
                          "text": "*${{ inputs.environment-label }} H2O deployed successfully!*"
                      }
                    },
                    {
                    "type": "section",
                      "text": {
                          "type": "mrkdwn",
                          "text": "*Repo:*\n<https://github.com/${{ github.repository }}|`${{ github.repository }}`>\n*Branch:*\n<https://github.com/${{ github.repository }}/tree/${{ github.ref_name }}|`${{ github.ref_name }}`>\n*Commit:*\n<https://github.com/${{ github.repository }}/commit/${{ github.sha }}|`${{ github.sha }}`>"
                      } 
                    },
                    {
                    "type": "section",
                      "text": {
                          "type": "mrkdwn",
                          "text": "*View the site:* <${{ vars.SITE_URL }}|${{ vars.SITE_URL }}>"
                      }
                    }
                ]
              }