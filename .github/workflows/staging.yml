name: Staging - Deploy to AWS

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging]

permissions:
    id-token: write
    contents: write   # lint_test.yml commits built assets
    packages: write   # push images to ghcr.io/harvard-lil

jobs:
  # Only allow merges from main
  check-source-branch:
    name: Check Source Branch
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Verify source branch is main
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "main" ]; then
            echo "❌ Error: Pull requests to staging must come from main branch"
            exit 1
          fi
          echo "✅ Source branch verification passed"

  lint-and-test:
    uses: ./.github/workflows/lint_test.yml
    secrets: inherit
    needs: check-source-branch
    if: always() && (github.event_name == 'push' || needs.check-source-branch.result == 'success')

  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: always() && github.event_name == 'push' && needs.lint-and-test.result == 'success'
    
    env:
      LOAD_BALANCER: ${{ secrets.STAGING_LOAD_BALANCER }}
      TARGET_GROUP: ${{ secrets.STAGING_TARGET_GROUP }}
      MAINTENANCE_TARGET_GROUP: ${{ secrets.STAGING_MAINTENANCE_TARGET_GROUP }}
      ECR_REPOSITORY: ${{ secrets.STAGING_ECR_REPOSITORY }}
      IMAGE_TAG: latest
      TASK_DEFINITION_FAMILY: ${{ secrets.STAGING_TASK_DEFINITION_FAMILY }}
      CONTAINER_NAME: ${{ secrets.STAGING_CONTAINER_NAME }}
      ECS_CLUSTER: ${{ secrets.STAGING_ECS_CLUSTER }}
      ECS_SERVICE: ${{ secrets.STAGING_ECS_SERVICE }}
      EVENT_RULES: ${{ secrets.STAGING_EVENT_RULES }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0   # need merge parents to resolve the main commit we promote


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.1
        with:
          role-to-assume: ${{ secrets.STAGING_AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.STAGING_AWS_REGION }}


      - name: Login to AWS ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2.1.4

      # Promote, do not rebuild. lint_test.yml built this image on main, ran the
      # suite against it, and pushed it tagged with the main commit SHA.
      # Deploying that exact artifact is what makes "tested" and "shipped" the
      # same bytes. Fails loudly rather than quietly building something new.
      - name: Resolve the tested image
        id: resolve
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -euo pipefail
          # Which commit on main produced the image we should deploy? That
          # depends on how the merge was made, and the repo permits all three
          # methods, so try the candidates rather than assuming one:
          #   HEAD^2  -- merge commit; the main tip that was merged in
          #   HEAD    -- fast-forward, squash, or direct push
          # Publishing tags the image with main's tip *after* its own
          # version-bump commit, so one of these matches whatever main pointed
          # at when the image was built.
          digest=""
          SOURCE_SHA=""
          for candidate in $(git rev-parse HEAD^2 2>/dev/null) $(git rev-parse HEAD); do
            echo "Looking for an image built from $candidate"
            # Resolve to a digest, not a tag: tags can be moved, digests cannot.
            found="$(aws ecr describe-images \
              --repository-name "$ECR_REPOSITORY" \
              --image-ids "imageTag=$candidate" \
              --query 'imageDetails[0].imageDigest' \
              --output text 2>/dev/null || true)"
            if [ -n "$found" ] && [ "$found" != "None" ]; then
              digest="$found"
              SOURCE_SHA="$candidate"
              break
            fi
          done

          if [ -z "$digest" ]; then
            echo "::error::No image found for any candidate commit in $ECR_REPOSITORY."
            echo "::error::That means this commit was never built and tested on main."
            echo "Recent tags in $ECR_REPOSITORY:"
            aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
              --query 'reverse(sort_by(imageDetails,&imagePushedAt))[:10].imageTags' \
              --output text || true
            exit 1
          fi

          echo "source-sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "image-uri=${REGISTRY}/${ECR_REPOSITORY}@${digest}" >> "$GITHUB_OUTPUT"

      # Keep the moving :latest tag pointing at what we deploy, so a Terraform
      # apply (whose task definition references :latest) cannot quietly revert
      # the service to an older image.
      - name: Point :latest at the promoted image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_URI: ${{ steps.resolve.outputs.image-uri }}
        run: |
          set -euxo pipefail
          docker buildx imagetools create \
            --tag "${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}" \
            "$IMAGE_URI"

      - name: Pin the web container to the promoted digest
        id: task-def
        uses: harvard-lil/lil-actions/ecs-register-task-def@main
        with:
          task-definition-family: ${{ env.TASK_DEFINITION_FAMILY }}
          container-name: ${{ env.CONTAINER_NAME }}
          image-uri: ${{ steps.resolve.outputs.image-uri }}

      - name: Deploy the digest-pinned task definition
        uses: harvard-lil/lil-actions/ecs-deploy@main
        with:
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          task-definition: ${{ steps.task-def.outputs.task-definition-arn }}

      - name: Put site into maintenance mode
        uses: harvard-lil/lil-actions/ecs-maintenance@main
        with:
          mode: 'on'
          load-balancer: ${{ env.LOAD_BALANCER }}
          target-group: ${{ env.TARGET_GROUP }}
          maintenance-target-group: ${{ env.MAINTENANCE_TARGET_GROUP }}

      - name: Wait for the new deployment to become stable
        uses: harvard-lil/lil-actions/ecs-wait-for-deployment@main
        with:
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}

      - name: Run Django migrations
        uses: harvard-lil/lil-actions/ecs-django-migrations@main
        with:
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          container: ${{ env.CONTAINER_NAME }}
          migrate-command: 'python manage.py migrate'

      - name: Create search index
        uses: harvard-lil/lil-actions/ecs-exec-command@main
        with:
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          container: ${{ env.CONTAINER_NAME }}
          command: 'invoke create-search-index'

      - name: Create reporting views
        uses: harvard-lil/lil-actions/ecs-exec-command@main
        with:
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          container: ${{ env.CONTAINER_NAME }}
          command: 'invoke create-reporting-views'

      - name: Update scheduled tasks with new task definition
        uses: harvard-lil/lil-actions/ecs-update-eventbridge@main
        with:
          event-rules: ${{ env.EVENT_RULES }}
          task-definition-arn: ${{ steps.task-def.outputs.task-definition-arn }}

      - name: Turn off Maintenance mode
        uses: harvard-lil/lil-actions/ecs-maintenance@main
        with:
          mode: 'off'
          load-balancer: ${{ env.LOAD_BALANCER }}
          target-group: ${{ env.TARGET_GROUP }}
          maintenance-target-group: ${{ env.MAINTENANCE_TARGET_GROUP }}

      - name: Purge Cloudflare cache
        uses: jakejarvis/cloudflare-purge-action@master
        env:
          CLOUDFLARE_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          
          
      - name: Notify Slack
        uses: slackapi/slack-github-action@v2.1.1
        with:
            webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
            webhook-type: incoming-webhook
            payload: |
              {
                "blocks": [
                    {
                      "type": "section",
                      "text": {
                          "type": "mrkdwn",
                          "text": "*Staging H2O deployed successfully!*"
                      }
                    },
                    {
                    "type": "section",
                      "text": {
                          "type": "mrkdwn",
                          "text": "*Repo:*\n<https://github.com/${{ github.repository }}|`${{ github.repository }}`>\n*Branch:*\n<https://github.com/${{ github.repository }}/tree/${{ github.ref_name }}|`${{ github.ref_name }}`>\n*Commit:*\n<https://github.com/${{ github.repository }}/commit/${{ github.sha }}|`${{ github.sha }}`>"
                      } 
                    },
                    {
                    "type": "section",
                      "text": {
                          "type": "mrkdwn",
                          "text": "*View the site:* <https://staging.opencasebook.org|https://staging.opencasebook.org>"
                      }
                    }
                ]
              }