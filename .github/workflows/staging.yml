name: Staging - Deploy to AWS

on:
  workflow_dispatch:
    inputs:
      force-maintenance:
        description: Open a maintenance window whether or not migrations call for one
        type: boolean
        default: false
      skip-maintenance:
        description: Assert the migrations are compatible with serving traffic and take no window
        type: boolean
        default: false
      hold-maintenance:
        description: Keep traffic held after a successful deploy; implies force-maintenance
        type: boolean
        default: false
  push:
    branches: [staging]
  pull_request:
    branches: [staging]

permissions:
    id-token: write     # assume the deploy role via OIDC
    contents: read
    pull-requests: read # read deploy labels off the merged pull request

concurrency:
  group: h2o-staging-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'deploy' }}
  cancel-in-progress: false

jobs:
  # Only allow merges from main
  check-source-branch:
    name: Check Source Branch
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Verify source branch is main
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$HEAD_REF" != "main" ] || [ "$HEAD_REPOSITORY" != "$REPOSITORY" ]; then
            echo "❌ Error: Pull requests to staging must come from main branch"
            exit 1
          fi
          echo "✅ Source branch verification passed"

  # Neither deploy tier lints or tests. check-source-branch limits this branch to
  # merges from main, so the tree here is one main has already run the suite
  # against, and the resolve step below will not deploy an image that main did
  # not publish.
  prepare:
    name: Prepare the staging artifact
    runs-on: ubuntu-latest
    environment: staging
    # A dispatch can be started from any branch the workflow file exists on, so
    # the ref is checked here where a push has already been limited to this one.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/staging' && github.repository == 'harvard-lil/h2o'
    
    outputs:
      image-digest: ${{ steps.resolve.outputs.image-digest }}
      source-sha: ${{ steps.resolve.outputs.source-sha }}

    env:
      # One repository holds every h2o image both tiers run. Named here rather
      # than read from the environment because it is the same name in every
      # tier, the way `pandoc-lambda` below already is.
      ECR_REPOSITORY: h2o

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # need merge parents to resolve the main commit we promote


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}


      # Promote, do not rebuild. lint_test.yml built this image on main, ran the
      # suite against it, and pushed it tagged with the main commit SHA.
      # Deploying that exact artifact is what makes "tested" and "shipped" the
      # same bytes. Fails loudly rather than quietly building something new.
      - name: Resolve the tested image
        id: resolve
        uses: harvard-lil/lil-actions/ecr-resolve-git-image@main
        with:
          repository: ${{ env.ECR_REPOSITORY }}

      # Mark both promoted artifacts before deploying them. ECR retention keeps
      # deployed images far longer than the build candidates that churn past
      # them every merge to main -- without this tag, the image the service is
      # running is just another candidate and ages out on the same schedule.
      #
      # `h2o` holds both tiers' images, so the tag carries the tier: the
      # repository's lifecycle policy gives `staging-deployed-` and
      # `prod-deployed-` a count each, and an image production has promoted
      # carries both tags and is kept on production's longer count.
      - name: Mark the promoted web image as deployed
        uses: harvard-lil/lil-actions/ecr-tag-image@main
        with:
          repository: ${{ env.ECR_REPOSITORY }}
          source: ${{ steps.resolve.outputs.image-digest }}
          tag: staging-deployed-${{ steps.resolve.outputs.source-sha }}

      # `pandoc-lambda` is one repository serving both tiers' export functions
      # and has always been, so its retention rule selects `deployed-` with no
      # tier in it. The tag stays that shape until that policy says otherwise;
      # a tier-prefixed tag here would match nothing the rule keeps.
      - name: Mark the promoted pandoc-lambda image as deployed
        uses: harvard-lil/lil-actions/ecr-tag-image@main
        with:
          repository: pandoc-lambda
          source: ${{ steps.resolve.outputs.source-sha }}
          tag: deployed-${{ steps.resolve.outputs.source-sha }}

  # The shared sequence. Everything above identifies which artifact to deploy
  # and marks it for this tier; everything below is identical for both tiers and
  # lives in one file so a staging run exercises production's code.
  deploy:
    needs: prepare
    # Named rather than left to the default success(): a job with no condition of
    # its own is skipped when anything in its needs graph is skipped, regardless
    # of whether the jobs it depends on succeeded.
    if: always() && needs.prepare.result == 'success'
    uses: ./.github/workflows/deploy_sequence.yml
    with:
      environment: staging
      environment-label: Staging
      image-digest: ${{ needs.prepare.outputs.image-digest }}
      source-sha: ${{ needs.prepare.outputs.source-sha }}
      # Guarded on the event so a push passes false rather than an empty value
      # to a boolean input; the sequence's deploy-flags step applies the same
      # guard before it reads them.
      force-maintenance: ${{ github.event_name == 'workflow_dispatch' && inputs.force-maintenance }}
      skip-maintenance: ${{ github.event_name == 'workflow_dispatch' && inputs.skip-maintenance }}
      hold-maintenance: ${{ github.event_name == 'workflow_dispatch' && inputs.hold-maintenance }}
    secrets:
      cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}

  # A job whose condition does not hold is skipped, and a skipped job leaves the
  # run green. This job is what makes a deploy that did not happen show up as a
  # failed run rather than a successful build.
  confirm-deploy:
    name: Confirm the deploy ran
    needs: [prepare, deploy]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Require a completed deploy
        env:
          RESULT: ${{ needs.deploy.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "::error::prepare succeeded but deploy was '$RESULT'; nothing was deployed."
            exit 1
          fi
          echo "deploy completed"
