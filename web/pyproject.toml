[project]
name = "h2o"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "bleach[css]>=6.4.0",
    "boto3>=1.43.93",
    "crispy-bootstrap3>=2024.1",
    "diff-match-patch>=20241021",
    "django~=6.1.0",
    "django-crispy-forms>=2.7",
    "django-extensions>=4.1",
    "django-json-widget>=2.1.1",
    "django-simple-history>=3.13.0",
    "django-storages>=1.14.6",
    "django-vite>=3.2.0",
    "djangorestframework>=3.18.1",
    "gunicorn>=26.2.0,<27",
    "invoke>=3.0.3",
    "pillow>=12.3.0",
    "psycopg2-binary>=2.9.13",
    "pyquery>=2.1.0",
    "requests>=2.34.2",
    "sentry-sdk>=2.69.1",
    "tqdm>=4.70.1",
    "whitenoise>=6.12.0",
]

[tool.uv]
package = false

[tool.black]
line-length = 100
target-version = ["py314"]
extend-exclude = "/(migrations|node_modules)/"
include = ".*.py$"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "django-debug-toolbar>=8.0.0",
    "django-stubs[compatible-mypy]>=6.1.1",
    "factory-boy>=3.3.3",
    "flake8>=7.3.0",
    "freezegun>=1.5.5",
    "ipdb>=0.13.13",
    "mypy>=2.3.1",
    "playwright>=1.62.0",
    "py-spy>=0.4.2",
    "pytest>=7.1.3",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.5",
    "pytest-mock>=3.15.1",
    "pytest-playwright>=0.9.0",
    "pytest-xdist>=3.8.0",
    "requests-mock>=1.12.1",
    "types-bleach>=6.4.0.20260728",
    "types-python-dateutil>=2.9.0.20260807",
    "types-requests>=2.33.0.20260906",
]
